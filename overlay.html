<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<style>

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:transparent;

overflow:hidden;

}



#vista{

width:100vw;
height:100vh;

overflow:hidden;

position:absolute;

left:0;
top:0;

}



#canvas{

position:absolute;

left:0;
top:0;

width:1080px;

height:1920px;

transform-origin:top left;

}



.box{

position:absolute;

overflow:hidden;

}



iframe{

width:100%;

height:100%;

border:none;

background:transparent;

pointer-events:none;

}


</style>

</head>



<body>


<div id="vista">


<div id="canvas">


</div>


</div>






<script type="module">


import {

initializeApp

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,

ref,

get

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDqdpAchewxlYmGrhFb5WyJK7U5LP2XsA",

authDomain:"tikfinity-overlay.firebaseapp.com",

databaseURL:"https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId:"tikfinity-overlay",

storageBucket:"tikfinity-overlay.firebasestorage.app",

messagingSenderId:"943639302610",

appId:"1:943639302610:web:5e747094f2f6151b70380b"

};



initializeApp(firebaseConfig);


const database=getDatabase();






const canvas=document.getElementById("canvas");






// ESCALAR 9:16 COMPLETO


function ajustarCanvas(){


const escala=Math.min(

window.innerWidth / 1080,

window.innerHeight / 1920

);



canvas.style.transform=

`scale(${escala})`;



}



window.addEventListener(
"resize",
ajustarCanvas
);


ajustarCanvas();







// CARGAR WIDGETS


const snapshot=await get(
ref(database,"diseño")
);



if(snapshot.exists()){


const diseño=snapshot.val();




Object.keys(diseño).forEach(id=>{



const data=diseño[id];



const box=document.createElement("div");


box.className="box";


box.id=id;



box.style.left=data.left;

box.style.top=data.top;

box.style.width=data.width;

box.style.height=data.height;





const iframe=document.createElement("iframe");


iframe.src=data.url;



box.appendChild(iframe);



canvas.appendChild(box);



});



}





</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:transparent;
  overflow:hidden;
}
/* CONTENEDOR DE LA VISTA */
#vista{
  width:100vw; height:100vh;
  overflow:hidden;
  position:absolute;
  left:0; top:0;
}
/* LIENZO REAL DEL EDITOR */
#canvas{
  position:absolute;
  left:0; top:0;
  width:1080px; height:1920px;
  transform-origin:top left;
}
.box{
  position:absolute;
  overflow:hidden;
}
iframe{
  width:100%; height:100%;
  border:none;
  background:transparent;
  pointer-events:none;
}
</style>
</head>
<body>
<div id="vista">
  <div id="canvas">
    <!-- Las cajas se generan dinámicamente desde Firebase -->
  </div>
</div>

<script type="module">
import { database, ref, get } from "./firebase.js";

const canvas = document.getElementById("canvas");

// ESCALA EL LIENZO COMPLETO COMO 9:16
function ajustarCanvas(){
  const escala = Math.min(
    window.innerWidth / 1080,
    window.innerHeight / 1920
  );
  canvas.style.transform = `scale(${escala})`;
}
window.addEventListener("resize", ajustarCanvas);
ajustarCanvas();

// CREA UNA CAJA CON SU IFRAME A PARTIR DE LOS DATOS GUARDADOS
function crearBox(id, datos){
  const box = document.createElement("div");
  box.className = "box";
  box.id = id;
  box.style.left = datos.left;
  box.style.top = datos.top;
  box.style.width = datos.width;
  box.style.height = datos.height;

  if(datos.link){
    const iframe = document.createElement("iframe");
    iframe.src = datos.link;
    box.appendChild(iframe);
  }

  canvas.appendChild(box);
}

// CARGAR POSICIONES Y ENLACES DESDE FIREBASE
async function iniciar(){
  const snapshot = await get(ref(database, "diseño"));
  if(snapshot.exists()){
    const diseño = snapshot.val();
    Object.keys(diseño).forEach(id=>{
      crearBox(id, diseño[id]);
    });
  }
}
iniciar();
</script>
</body>
</html>

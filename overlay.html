<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:transparent;
  overflow:hidden;
}
/* CONTENEDOR DE LA VISTA */
#vista{
  width:100vw; height:100vh;
  overflow:hidden;
  position:absolute;
  left:0; top:0;
}
/* LIENZO REAL DEL EDITOR */
#canvas{
  position:absolute;
  left:0; top:0;
  width:1080px; height:1920px;
  transform-origin:top left;
  will-change: transform;
}
.box{
  position:absolute;
  overflow:hidden;
}
iframe{
  position:absolute;
  left:0; top:0;
  border:none;
  background:transparent;
  pointer-events:none;
  transform-origin:top left;
  will-change: transform;
}
.texto-caja{
  width:100%; height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#ffffff;
  font-weight:bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,.8);
  word-break:break-word;
  padding:4px;
  box-sizing:border-box;
}
</style>
</head>
<body>
<div id="vista">
  <div id="canvas">
    <!-- Las cajas se generan dinámicamente desde Firebase -->
  </div>
</div>

<script type="module">
import { database, ref, get, onValue } from "./firebase.js";

const canvas = document.getElementById("canvas");

// ESCALA EL LIENZO COMPLETO COMO 9:16
let resizePendiente = false;
function ajustarCanvas(){
  const escala = Math.min(
    window.innerWidth / 1080,
    window.innerHeight / 1920
  );
  canvas.style.transform = `scale(${escala})`;
}
// requestAnimationFrame evita que se recalcule más veces de las necesarias
// si el resize se dispara muy seguido (ahorra CPU en sesiones largas)
window.addEventListener("resize", ()=>{
  if(resizePendiente) return;
  resizePendiente = true;
  requestAnimationFrame(()=>{
    ajustarCanvas();
    resizePendiente = false;
  });
});
ajustarCanvas();

// CREA UNA CAJA A PARTIR DE LOS DATOS GUARDADOS.
// Si es un widget (iframe), aplica el mismo zoom que se calculó en el editor.
// Si es una caja de texto, se suscribe a Firebase en tiempo real (onValue)
// para que el texto se actualice solo, sin recargar la página.
function crearBox(id, datos){
  const box = document.createElement("div");
  box.className = "box";
  box.id = id;
  box.style.left = datos.left;
  box.style.top = datos.top;
  box.style.width = datos.width;
  box.style.height = datos.height;

  if(datos.type === "texto"){
    const contenido = document.createElement("div");
    contenido.className = "texto-caja";
    contenido.textContent = datos.texto || "";
    contenido.style.fontSize = (datos.fontSize || 60) + "px";
    contenido.style.color = datos.color || "#ffffff";
    box.appendChild(contenido);
    canvas.appendChild(box);

    // Escucha en tiempo real SOLO el texto de esta caja.
    // Cada vez que se actualice en Firebase (desde el editor), se refleja
    // al instante acá, sin tocar el resto de los elementos del overlay.
    onValue(ref(database, "diseño/" + id + "/texto"), (snap)=>{
      if(snap.exists()){
        contenido.textContent = snap.val();
      }
    });

  } else if(datos.link){
    const baseWidth = parseFloat(datos.baseWidth) || 400;
    const baseHeight = parseFloat(datos.baseHeight) || 150;
    const width = parseFloat(datos.width);
    const height = parseFloat(datos.height);

    const iframe = document.createElement("iframe");
    iframe.src = datos.link;
    iframe.style.width = baseWidth + "px";
    iframe.style.height = baseHeight + "px";
    iframe.style.transform = `scale(${width / baseWidth}, ${height / baseHeight})`;
    box.appendChild(iframe);
    canvas.appendChild(box);
  } else {
    canvas.appendChild(box);
  }
}

// CARGAR POSICIONES Y ENLACES DESDE FIREBASE
async function iniciar(){
  const snapshot = await get(ref(database, "diseño"));
  if(snapshot.exists()){
    const diseño = snapshot.val();
    Object.keys(diseño).forEach(id=>{
      crearBox(id, diseño[id]);
    });
  }
}
iniciar();
</script>
</body>
</html>

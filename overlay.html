<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<style>

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:transparent;

overflow:hidden;

}


/* LIENZO 9:16 */

#vista{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

overflow:hidden;

}



#canvas{

position:absolute;

left:0;
top:0;

width:1080px;

height:1920px;

transform-origin:top left;

}



.box{

position:absolute;

overflow:hidden;

}



iframe{

width:100%;

height:100%;

border:none;

background:transparent;

pointer-events:none;

}



</style>


</head>


<body>


<div id="vista">


<div id="canvas">


</div>


</div>





<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,

ref,

get

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDqdpAchewxlYmGrhFb5WyJKqbL5UP2XsA",

authDomain:"tikfinity-overlay.firebaseapp.com",

databaseURL:"https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId:"tikfinity-overlay",

storageBucket:"tikfinity-overlay.firebasestorage.app",

messagingSenderId:"943639302610",

appId:"1:943639302610:web:5e747094f2f6151b70380b"

};



initializeApp(firebaseConfig);



const db=getDatabase();




const canvas=document.getElementById("canvas");






// ESCALA AUTOMATICA 9:16


function ajustarCanvas(){


let escala=Math.min(

window.innerWidth/1080,

window.innerHeight/1920

);



canvas.style.transform=

`scale(${escala})`;


}



window.addEventListener("resize",ajustarCanvas);


ajustarCanvas();








// CARGAR ELEMENTOS


const datos=await get(ref(db,"diseño"));



if(datos.exists()){



const diseño=datos.val();



Object.keys(diseño).forEach(id=>{


const elemento=diseño[id];



const box=document.createElement("div");


box.className="box";

box.id=id;



box.style.left=elemento.left;

box.style.top=elemento.top;

box.style.width=elemento.width;

box.style.height=elemento.height;



box.innerHTML=`

<iframe src="${elemento.url}"></iframe>

`;



canvas.appendChild(box);



});



}



</script>



</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:transparent;
  overflow:hidden;
}
#vista{
  width:100vw; height:100vh;
  overflow:hidden;
  position:absolute;
  left:0; top:0;
}
#canvas{
  position:absolute;
  left:0; top:0;
  width:1080px; height:1920px;
  transform-origin:top left;
}
.box{
  position:absolute;
  overflow:hidden;
}
iframe{
  position:absolute;
  left:0; top:0;
  border:none;
  background:transparent;
  pointer-events:none;
  transform-origin:top left;
}
.texto-contenido{
  width:100%; height:100%;
  background:#000; color:#fff;
  display:flex; align-items:center; justify-content:center;
  text-align:center; box-sizing:border-box; padding:10px;
  font-size:48px; font-weight:bold;
  word-break:break-word; line-height:1.2;
}
#estado-tikfinity{
  position:fixed;
  bottom:8px; right:8px;
  font-size:11px;
  font-family:sans-serif;
  padding:4px 8px;
  border-radius:4px;
  z-index:9999;
  opacity:0.75;
  pointer-events:none;
}
#estado-tikfinity.conectado   { background:#1b5e20; color:#a5d6a7; }
#estado-tikfinity.desconectado{ background:#b71c1c; color:#ef9a9a; }
#estado-tikfinity.reconectando{ background:#e65100; color:#ffe0b2; }
</style>
</head>
<body>

<div id="vista">
  <div id="canvas">
    <!-- Las cajas se generan dinámicamente desde Firebase -->
  </div>
</div>

<div id="estado-tikfinity" class="desconectado">⬤ Tikfinity desconectado</div>

<script type="module">
import { database, ref, onValue, set } from "./firebase.js";

// ═══════════════════════════════════════════════════════
//  MAPA DE REGALOS → CAJAS (dinámico desde Firebase)
// ═══════════════════════════════════════════════════════
let mapaRegalos = {};

// ═══════════════════════════════════════════════════════
//  CONTADORES EN MEMORIA
//  Se sincronizan desde Firebase al cargar cada caja,
//  así nunca suman desde 0 si ya había un valor previo.
// ═══════════════════════════════════════════════════════
const contadores = {};

function registrarRegalo(giftId, cantidad){
  const clave = String(giftId);
  const cajaId = mapaRegalos[clave];
  if(!cajaId){
    console.log(`[Regalo no mapeado] ID:${giftId}`);
    return;
  }
  contadores[cajaId] = (contadores[cajaId] || 0) + cantidad;
  set(ref(database, "textoLive/" + cajaId), String(contadores[cajaId]))
    .catch(err => console.warn("Firebase write error:", err));
  console.log(`[Contador actualizado] ID:${giftId} → ${contadores[cajaId]}`);
}

// ═══════════════════════════════════════════════════════
//  WEBSOCKET — Tikfinity Desktop (puerto 21213)
// ═══════════════════════════════════════════════════════
const WS_URL = "ws://127.0.0.1:21213/";
const estadoEl = document.getElementById("estado-tikfinity");
let ws = null;
let reconectarTimer = null;

function setEstado(estado, texto){
  estadoEl.className = estado;
  estadoEl.textContent = texto;
}

function conectarTikfinity(){
  if(ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

  setEstado("reconectando", "⬤ Conectando a Tikfinity…");
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setEstado("conectado", "⬤ Tikfinity conectado");
    console.log("[Tikfinity WS] Conectado");
    clearTimeout(reconectarTimer);
    ws.send(JSON.stringify({ type: "subscribe", events: ["gift"] }));
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch(e){ return; }

    // Tikfinity manda el tipo en msg.type o msg.event
    const tipo = (msg.type || msg.event || "").toLowerCase();
    if(tipo !== "gift") return;

    console.log("[Tikfinity WS] Regalo recibido:", JSON.stringify(msg));

    // FIX: los datos reales vienen dentro de msg.data o directo en msg
    const d = msg.data || msg;

    // FIX: el objeto del regalo puede venir anidado en d.gift (payload real
    // confirmado: {"gift":{"gift_id":...,"repeat_count":...,"repeat_end":...}})
    // o directo en d/msg con otros nombres de campo según la versión de
    // Tikfinity. Contemplamos ambos casos y ambos formatos (camelCase y
    // snake_case).
    const g = d.gift || msg.gift || d;

    // FILTRO CLAVE: solo contar cuando repeat_end/repeatEnd === true
    // false = regalo en progreso (o parte de un combo que sigue) → ignorar
    // true  = regalo terminado → contar
    const terminado = g.repeatEnd ?? g.repeat_end ?? d.repeatEnd ?? d.repeat_end ?? false;
    if(!terminado){
      console.log("[En progreso, ignorando]");
      return;
    }

    // ID real del regalo — esto es lo único que usamos para el matching
    const giftId = g.giftId ?? g.gift_id ?? d.giftId ?? d.gift_id ?? msg.giftId ?? msg.gift_id;

    const cantidad = parseInt(
      g.repeatCount ?? g.repeat_count ??
      d.repeatCount ?? d.repeat_count ??
      msg.repeatCount ?? msg.repeat_count ?? 1
    ) || 1;

    if(giftId === undefined || giftId === null){
      console.log("[Regalo sin ID, ignorado]", JSON.stringify(msg));
      return;
    }

    console.log(`[Regalo FINAL] ID:${giftId} x${cantidad}`);
    registrarRegalo(giftId, cantidad);
  };

  ws.onerror = (err) => {
    console.warn("[Tikfinity WS] Error:", err);
  };

  ws.onclose = () => {
    setEstado("desconectado", "⬤ Tikfinity desconectado");
    console.log("[Tikfinity WS] Cerrado — reintentando en 5s…");
    reconectarTimer = setTimeout(conectarTikfinity, 5000);
  };
}

// ═══════════════════════════════════════════════════════
//  CANVAS / FIREBASE
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById("canvas");

let resizePendiente = false;
function ajustarCanvas(){
  const escala = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  canvas.style.transform = `scale(${escala})`;
}
window.addEventListener("resize", ()=>{
  if(resizePendiente) return;
  resizePendiente = true;
  requestAnimationFrame(()=>{ ajustarCanvas(); resizePendiente = false; });
});
ajustarCanvas();

const cajasCreadas = {};

// ── iframe ──
function crearBoxIframe(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  // FIX: crear iframe con src vacío primero, luego actualizarBoxIframe
  // lo pone correctamente evitando una petición vacía inicial
  const iframe = document.createElement("iframe");
  iframe.src = "";
  box.appendChild(iframe);
  canvas.appendChild(box);
  actualizarBoxIframe(box, datos);
  cajasCreadas[id] = { box, tipo:"iframe" };
}

function actualizarBoxIframe(box, datos){
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;
  const baseWidth  = parseFloat(datos.baseWidth)  || 400;
  const baseHeight = parseFloat(datos.baseHeight) || 150;
  const iframe = box.querySelector("iframe");
  // Solo actualiza src si cambió, evita recargar el widget innecesariamente
  if(datos.link && iframe.src !== datos.link) iframe.src = datos.link;
  iframe.style.width  = baseWidth  + "px";
  iframe.style.height = baseHeight + "px";
  iframe.style.transform = `scale(${parseFloat(datos.width)/baseWidth}, ${parseFloat(datos.height)/baseHeight})`;
}

// ── texto / contador ──
function crearBoxTexto(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;

  const contenido = document.createElement("div");
  contenido.className = "texto-contenido";
  // Mostramos el contenido del diseño inicialmente;
  // onValue lo reemplazará con el valor real de textoLive apenas cargue
  contenido.textContent = datos.contenido || "";
  box.appendChild(contenido);
  canvas.appendChild(box);
  cajasCreadas[id] = { box, tipo:"texto" };

  // FIX: siempre escucha textoLive/{id} para sincronizar el valor real
  // desde Firebase, independiente del contenido guardado en diseño.
  // Esto asegura que los contadores siempre muestren el valor correcto
  // incluso si el editor guardó "0" en diseño/{id}/contenido.
  onValue(ref(database, "textoLive/" + id), (snapshot)=>{
    if(snapshot.exists()){
      const val = snapshot.val();
      contenido.textContent = val;
      contadores[id] = parseInt(val) || 0;
    }
  });
}

function actualizarBoxTexto(box, datos){
  // Solo actualiza posición y tamaño, NUNCA el contenido
  // para no pisar el valor del contador en pantalla
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;
}

// Esperar primer diseño antes de conectar Tikfinity
let primerDiseñoListo = false;
let avisarPrimerDiseño;
const primerDiseñoPromise = new Promise(res => avisarPrimerDiseño = res);

onValue(ref(database, "diseño"), (snapshot)=>{
  const diseño = snapshot.exists() ? snapshot.val() : {};
  const idsNuevos = Object.keys(diseño);

  // Eliminar cajas que ya no existen en Firebase
  Object.keys(cajasCreadas).forEach(id=>{
    if(!idsNuevos.includes(id)){
      cajasCreadas[id].box.remove();
      delete cajasCreadas[id];
    }
  });

  idsNuevos.forEach(id=>{
    const datos = diseño[id];

    // FIX: ignorar cualquier tipo desconocido (jarron u otros)
    // para no romper el overlay si quedaron datos viejos en Firebase
    if(datos.tipo !== "texto" && datos.tipo !== "iframe") return;

    const existente = cajasCreadas[id];
    if(!existente){
      if(datos.tipo === "texto") crearBoxTexto(id, datos);
      else crearBoxIframe(id, datos);
    } else if(existente.tipo === "texto"){
      actualizarBoxTexto(existente.box, datos);
    } else {
      actualizarBoxIframe(existente.box, datos);
    }
  });

  // Reconstruir mapa de regalos desde Firebase — la clave ahora es el ID
  // del regalo (regaloId), no el nombre. El nombre solo queda como
  // referencia visual en el editor.
  const nuevoMapa = {};
  idsNuevos.forEach(id=>{
    const datos = diseño[id];
    if(datos.tipo === "texto" && datos.contador && datos.regaloId){
      nuevoMapa[String(datos.regaloId)] = id;
    }
  });
  mapaRegalos = nuevoMapa;
  console.log("[mapaRegalos actualizado]", mapaRegalos);

  if(!primerDiseñoListo){
    primerDiseñoListo = true;
    avisarPrimerDiseño();
  }
});

// ═══════════════════════════════════════════════════════
//  ARRANQUE — esperar diseño de Firebase, luego conectar
// ═══════════════════════════════════════════════════════
await primerDiseñoPromise;
conectarTikfinity();

</script>
</body>
</html>

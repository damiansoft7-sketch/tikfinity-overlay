<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;700&family=Press+Start+2P&family=Rajdhani:wght@400;700&family=Exo+2:wght@400;700&family=Roboto:wght@400;700&family=Anton&family=Bangers&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:transparent;
  overflow:hidden;
}
#vista{
  width:100vw; height:100vh;
  overflow:hidden;
  position:absolute;
  left:0; top:0;
}
#canvas{
  position:absolute;
  left:0; top:0;
  width:1080px; height:1920px;
  transform-origin:top left;
}
.box{
  position:absolute;
  overflow:hidden;
}
iframe{
  position:absolute;
  left:0; top:0;
  border:none;
  background:transparent;
  pointer-events:none;
  transform-origin:top left;
}
.texto-contenido{
  width:100%; height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-sizing:border-box;
  padding:10px;
  font-size:48px;
  font-weight:bold;
  word-break:break-word;
  line-height:1.2;
  /* Estilos base — se sobreescriben desde Firebase (campo estilos) */
  background:#000;
  color:#fff;
}
#estado-tikfinity{
  position:fixed;
  bottom:8px; right:8px;
  font-size:11px;
  font-family:sans-serif;
  padding:4px 8px;
  border-radius:4px;
  z-index:9999;
  opacity:0.75;
  pointer-events:none;
}
#estado-tikfinity.conectado   { background:#1b5e20; color:#a5d6a7; }
#estado-tikfinity.desconectado{ background:#b71c1c; color:#ef9a9a; }
#estado-tikfinity.reconectando{ background:#e65100; color:#ffe0b2; }
</style>
</head>
<body>

<div id="vista">
  <div id="canvas">
    <!-- Las cajas se generan dinámicamente desde Firebase -->
  </div>
</div>

<div id="estado-tikfinity" class="desconectado">⬤ Tikfinity desconectado</div>

<script type="module">
import { database, ref, onValue, set } from "./firebase.js";

// ═══════════════════════════════════════════════════════
//  MAPA DE REGALOS → CAJAS (dinámico desde Firebase)
// ═══════════════════════════════════════════════════════
let mapaRegalos = {};

// ═══════════════════════════════════════════════════════
//  CONTADORES EN MEMORIA
// ═══════════════════════════════════════════════════════
const contadores = {};

function registrarRegalo(giftId, cantidad){
  const clave = String(giftId);
  const cajaId = mapaRegalos[clave];
  if(!cajaId){
    console.log(`[Regalo no mapeado] ID:${giftId}`);
    return;
  }
  contadores[cajaId] = (contadores[cajaId] || 0) + cantidad;
  set(ref(database, "textoLive/" + cajaId), String(contadores[cajaId]))
    .catch(err => console.warn("Firebase write error:", err));
  console.log(`[Contador actualizado] ID:${giftId} → ${contadores[cajaId]}`);
}

// ═══════════════════════════════════════════════════════
//  DEDUPE DE EVENTOS DE REGALO
// ═══════════════════════════════════════════════════════
const VENTANA_DEDUPE_MS = 4000;
const eventosRecientes = new Map();

function esEventoDuplicado(giftId, cantidad, msgId){
  const ahora = Date.now();
  for(const [clave, t] of eventosRecientes){
    if(ahora - t > VENTANA_DEDUPE_MS) eventosRecientes.delete(clave);
  }
  const clave = (msgId !== null && msgId !== undefined) ? `id:${msgId}` : `combo:${giftId}:${cantidad}`;
  if(eventosRecientes.has(clave)) return true;
  eventosRecientes.set(clave, ahora);
  return false;
}

// ═══════════════════════════════════════════════════════
//  DETECTOR DE FALLO SILENCIOSO
// ═══════════════════════════════════════════════════════
const UMBRAL_ALERTA_SIN_FINAL = 40;
let mensajesSinFinalSeguidos = 0;

// ═══════════════════════════════════════════════════════
//  WEBSOCKET — Tikfinity Desktop (puerto 21213)
// ═══════════════════════════════════════════════════════
const WS_URL = "ws://127.0.0.1:21213/";
const estadoEl = document.getElementById("estado-tikfinity");
let ws = null;
let reconectarTimer = null;

function setEstado(estado, texto){
  estadoEl.className = estado;
  estadoEl.textContent = texto;
}

function conectarTikfinity(){
  if(ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

  setEstado("reconectando", "⬤ Conectando a Tikfinity…");
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setEstado("conectado", "⬤ Tikfinity conectado");
    console.log("[Tikfinity WS] Conectado");
    clearTimeout(reconectarTimer);
    ws.send(JSON.stringify({ type: "subscribe", events: ["gift"] }));
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch(e){ return; }

    const tipo = (msg.type || msg.event || "").toLowerCase();
    if(tipo !== "gift") return;

    console.log("[Tikfinity WS] Regalo recibido:", JSON.stringify(msg));

    const d = msg.data || msg;
    const g = d.gift || msg.gift || d;

    const terminado = g.repeatEnd ?? g.repeat_end ?? d.repeatEnd ?? d.repeat_end ?? false;
    if(!terminado){
      mensajesSinFinalSeguidos++;
      if(mensajesSinFinalSeguidos === UMBRAL_ALERTA_SIN_FINAL){
        console.warn(
          `⚠ [Posible cambio de formato] Van ${UMBRAL_ALERTA_SIN_FINAL} regalos seguidos sin ningún "final". ` +
          `Si los contadores dejaron de moverse, revisá el campo repeatEnd/repeat_end en este mensaje real:`,
          JSON.stringify(msg)
        );
      }
      console.log("[En progreso, ignorando]");
      return;
    }
    mensajesSinFinalSeguidos = 0;

    const giftId = g.giftId ?? g.gift_id ?? d.giftId ?? d.gift_id ?? msg.giftId ?? msg.gift_id;
    const cantidad = parseInt(
      g.repeatCount ?? g.repeat_count ??
      d.repeatCount ?? d.repeat_count ??
      msg.repeatCount ?? msg.repeat_count ?? 1
    ) || 1;

    if(giftId === undefined || giftId === null){
      console.log("[Regalo sin ID, ignorado]", JSON.stringify(msg));
      return;
    }

    const msgId = msg.msgId ?? msg.msg_id ?? d.msgId ?? d.msg_id ?? g.msgId ?? g.msg_id ?? null;
    if(esEventoDuplicado(giftId, cantidad, msgId)){
      console.log(`[Duplicado ignorado] ID:${giftId} x${cantidad}`);
      return;
    }

    console.log(`[Regalo FINAL] ID:${giftId} x${cantidad}`);
    registrarRegalo(giftId, cantidad);
  };

  ws.onerror = (err) => {
    console.warn("[Tikfinity WS] Error:", err);
  };

  ws.onclose = () => {
    setEstado("desconectado", "⬤ Tikfinity desconectado");
    console.log("[Tikfinity WS] Cerrado — reintentando en 5s…");
    reconectarTimer = setTimeout(conectarTikfinity, 5000);
  };
}

// ═══════════════════════════════════════════════════════
//  HELPERS DE ESTILOS
// ═══════════════════════════════════════════════════════
function hexToRgb(hex){
  const h = hex.replace("#","");
  const r = parseInt(h.slice(0,2),16);
  const g = parseInt(h.slice(2,4),16);
  const b = parseInt(h.slice(4,6),16);
  return {r,g,b};
}

function aplicarEstilosAContenido(contenido, estilos){
  if(!estilos) return;
  const font    = estilos.font    || "sans-serif";
  const size    = parseInt(estilos.size)  || 48;
  const bold    = estilos.bold    === true || estilos.bold === "true";
  const italic  = estilos.italic  === true || estilos.italic === "true";
  const shadow  = estilos.shadow  === true || estilos.shadow === "true";
  const color   = estilos.color   || "#ffffff";
  const bgcolor = estilos.bgcolor || "#000000";
  const alpha   = estilos.alpha   !== undefined ? parseInt(estilos.alpha) : 100;
  const align   = estilos.align   || "center";
  const valign  = estilos.valign  || "center";

  const {r,g,b} = hexToRgb(bgcolor);
  const a = alpha / 100;

  contenido.style.fontFamily     = font;
  contenido.style.fontSize       = size + "px";
  contenido.style.fontWeight     = bold   ? "700" : "400";
  contenido.style.fontStyle      = italic ? "italic" : "normal";
  contenido.style.textShadow     = shadow ? "2px 2px 8px rgba(0,0,0,0.9)" : "none";
  contenido.style.color          = color;
  contenido.style.background     = alpha === 0 ? "transparent" : `rgba(${r},${g},${b},${a})`;
  contenido.style.textAlign      = align;
  contenido.style.justifyContent = align === "left" ? "flex-start" : align === "right" ? "flex-end" : "center";
  contenido.style.alignItems     = valign;
}

// ═══════════════════════════════════════════════════════
//  CANVAS / FIREBASE
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById("canvas");

let resizePendiente = false;
function ajustarCanvas(){
  const escala = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  canvas.style.transform = `scale(${escala})`;
}
window.addEventListener("resize", ()=>{
  if(resizePendiente) return;
  resizePendiente = true;
  requestAnimationFrame(()=>{ ajustarCanvas(); resizePendiente = false; });
});
ajustarCanvas();

const cajasCreadas = {};

// ── iframe ──
function crearBoxIframe(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  const iframe = document.createElement("iframe");
  iframe.src = "";
  box.appendChild(iframe);
  canvas.appendChild(box);
  actualizarBoxIframe(box, datos);
  cajasCreadas[id] = { box, tipo:"iframe" };
}

function actualizarBoxIframe(box, datos){
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;
  const baseWidth  = parseFloat(datos.baseWidth)  || 400;
  const baseHeight = parseFloat(datos.baseHeight) || 150;
  const iframe = box.querySelector("iframe");
  if(datos.link && iframe.src !== datos.link) iframe.src = datos.link;
  iframe.style.width  = baseWidth  + "px";
  iframe.style.height = baseHeight + "px";
  iframe.style.transform = `scale(${parseFloat(datos.width)/baseWidth}, ${parseFloat(datos.height)/baseHeight})`;
}

// ── texto / contador ──
function crearBoxTexto(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;

  const contenido = document.createElement("div");
  contenido.className = "texto-contenido";
  contenido.textContent = datos.contenido || "";
  box.appendChild(contenido);

  // Aplicar estilos guardados (si existen)
  if(datos.estilos) aplicarEstilosAContenido(contenido, datos.estilos);

  canvas.appendChild(box);

  const unsub = onValue(ref(database, "textoLive/" + id), (snapshot)=>{
    if(snapshot.exists()){
      const val = snapshot.val();
      contenido.textContent = val;
      contadores[id] = parseInt(val) || 0;
    }
  });

  cajasCreadas[id] = { box, tipo:"texto", unsub };
}

function actualizarBoxTexto(box, datos){
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;
  // Re-aplicar estilos si cambiaron en el editor
  const contenido = box.querySelector(".texto-contenido");
  if(contenido && datos.estilos) aplicarEstilosAContenido(contenido, datos.estilos);
}

// Esperar primer diseño antes de conectar Tikfinity
let primerDiseñoListo = false;
let avisarPrimerDiseño;
const primerDiseñoPromise = new Promise(res => avisarPrimerDiseño = res);

onValue(ref(database, "diseño"), (snapshot)=>{
  const diseño = snapshot.exists() ? snapshot.val() : {};
  const idsNuevos = Object.keys(diseño);

  // Eliminar cajas que ya no existen en Firebase
  Object.keys(cajasCreadas).forEach(id=>{
    if(!idsNuevos.includes(id)){
      if(typeof cajasCreadas[id].unsub === "function") cajasCreadas[id].unsub();
      cajasCreadas[id].box.remove();
      delete cajasCreadas[id];
    }
  });

  idsNuevos.forEach(id=>{
    const datos = diseño[id];
    if(datos.tipo !== "texto" && datos.tipo !== "iframe") return;

    const existente = cajasCreadas[id];
    if(!existente){
      if(datos.tipo === "texto") crearBoxTexto(id, datos);
      else crearBoxIframe(id, datos);
    } else if(existente.tipo === "texto"){
      actualizarBoxTexto(existente.box, datos);
    } else {
      actualizarBoxIframe(existente.box, datos);
    }
  });

  // Reconstruir mapa de regalos
  const nuevoMapa = {};
  idsNuevos.forEach(id=>{
    const datos = diseño[id];
    if(datos.tipo === "texto" && datos.contador && datos.regaloId){
      nuevoMapa[String(datos.regaloId)] = id;
    }
  });
  mapaRegalos = nuevoMapa;
  console.log("[mapaRegalos actualizado]", mapaRegalos);

  if(!primerDiseñoListo){
    primerDiseñoListo = true;
    avisarPrimerDiseño();
  }
});

// ═══════════════════════════════════════════════════════
//  ARRANQUE — esperar diseño de Firebase, luego conectar
// ═══════════════════════════════════════════════════════
await primerDiseñoPromise;
conectarTikfinity();

</script>
</body>
</html>

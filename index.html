<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>


html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}



/* LIENZO 9:16 */

#canvas{

position:relative;

width:56.25vh;

height:100vh;

max-width:100vw;

max-height:177.78vw;

margin:auto;

}



/* MARCO DE GUÍA */

#marco{

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

border:3px solid white;

box-sizing:border-box;

pointer-events:none;

z-index:500;

}





/* ELEMENTOS */

.box{

position:absolute;

}





iframe{

width:100%;

height:100%;

border:none;

background:transparent;

pointer-events:none;

}





/* BOTÓN GUARDAR */


#guardar{

position:fixed;

top:10px;

left:10px;

padding:12px;

font-size:16px;

z-index:999;

}





</style>


</head>



<body>



<button id="guardar">
GUARDAR DISEÑO
</button>




<div id="canvas">


<div id="marco"></div>




<div class="box" id="box1"
style="left:5%;top:5%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749">
</iframe>

</div>





<div class="box" id="box2"
style="right:5%;top:5%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749">
</iframe>

</div>





<div class="box" id="box3"
style="left:5%;bottom:20%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749">
</iframe>

</div>





<div class="box" id="box4"
style="right:5%;bottom:5%;width:45%;height:20%;">

<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749">
</iframe>

</div>



</div>






<script>


const boxes=document.querySelectorAll(".box");





/* CARGAR CONFIGURACIÓN DESDE LINK */


const params=new URLSearchParams(window.location.search);



boxes.forEach(box=>{


let saved=params.get(box.id);



if(saved){


let data=JSON.parse(atob(saved));


box.style.left=data.left;

box.style.top=data.top;

box.style.width=data.width;

box.style.height=data.height;

box.style.transform=data.transform;


}



});







/* EDITOR */


boxes.forEach(box=>{


const moveable=new Moveable(document.body,{


target:box,

draggable:true,

resizable:true,

keepRatio:false


});






moveable.on("drag",e=>{


e.target.style.transform=e.transform;


});






moveable.on("resize",e=>{


e.target.style.width=e.width+"px";

e.target.style.height=e.height+"px";


});



});







/* GENERAR ENLACE */


document.getElementById("guardar").onclick=()=>{


let url=location.origin+location.pathname+"?";



boxes.forEach(box=>{


let data={


left:box.style.left,

top:box.style.top,

width:box.style.width,

height:box.style.height,

transform:box.style.transform || ""


};



url += box.id+"="+btoa(JSON.stringify(data))+"&";



});



prompt(
"Copia este enlace para PRISM Live:",
url
);



};




</script>


</body>

</html>

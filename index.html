<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>


html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#222;

    overflow:hidden;

}


/* LIENZO 9:16 */

#canvas{

    position:relative;

    width:56.25vh;
    height:100vh;

    max-width:100vw;
    max-height:177.78vw;

    margin:auto;

    background:transparent;

}



/* CAJAS MOVIBLES */

.box{

    position:absolute;

}



/* EL CONTENIDO NO BLOQUEA EL ARRASTRE */

iframe{

    width:100%;
    height:100%;

    border:none;

    background:transparent;

    pointer-events:none;

}



/* POSICIONES INICIALES */


#box1{

    top:5%;
    left:5%;

    width:45%;
    height:15%;

}



#box2{

    top:5%;
    right:5%;

    width:45%;
    height:15%;

}



#box3{

    bottom:20%;
    left:5%;

    width:45%;
    height:15%;

}



#box4{

    bottom:5%;
    right:5%;

    width:45%;
    height:20%;

}



</style>


</head>



<body>


<div id="canvas">



<div class="box" id="box1">

<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749"></iframe>

</div>



<div class="box" id="box2">

<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749"></iframe>

</div>



<div class="box" id="box3">

<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749"></iframe>

</div>



<div class="box" id="box4">

<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749"></iframe>

</div>



</div>




<script>


const boxes = document.querySelectorAll(".box");



boxes.forEach((box)=>{


const moveable = new Moveable(document.body,{

    target:box,

    draggable:true,

    resizable:true,

    keepRatio:false,

});




/* MOVER */

moveable.on("drag", e=>{

    e.target.style.transform = e.transform;

});





/* CAMBIAR TAMAÑO */

moveable.on("resize", e=>{


    e.target.style.width = e.width + "px";

    e.target.style.height = e.height + "px";


});



});



</script>



</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}


#canvas{

position:relative;

width:56.25vh;
height:100vh;

max-width:100vw;
max-height:177.78vw;

margin:auto;

}



#marco{

position:absolute;

width:100%;
height:100%;

border:3px solid white;

box-sizing:border-box;

pointer-events:none;

z-index:10;

}



.box{

position:absolute;

}



iframe{

width:100%;
height:100%;

border:none;

background:transparent;

pointer-events:none;

}



#guardar{

position:fixed;

top:10px;
left:10px;

z-index:999;

padding:12px;

font-size:16px;

}



</style>


</head>



<body>



<button id="guardar">
GUARDAR EN FIREBASE
</button>



<div id="canvas">


<div id="marco"></div>



<div class="box" id="box1"
style="left:5%;top:5%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749"></iframe>

</div>



<div class="box" id="box2"
style="right:5%;top:5%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749"></iframe>

</div>



<div class="box" id="box3"
style="left:5%;bottom:20%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749"></iframe>

</div>



<div class="box" id="box4"
style="right:5%;bottom:5%;width:45%;height:20%;">

<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749"></iframe>

</div>


</div>




<script type="module">


/* FIREBASE */


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getDatabase,
ref,
set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig = {


apiKey: "TU_API_KEY",

authDomain: "TU_AUTH_DOMAIN",

databaseURL: "TU_DATABASE_URL",

projectId: "TU_PROJECT_ID",

storageBucket: "TU_STORAGE_BUCKET",

messagingSenderId: "TU_MESSAGING_ID",

appId: "TU_APP_ID"


};





const app = initializeApp(firebaseConfig);


const database = getDatabase(app);





/* EDITOR */


const boxes=document.querySelectorAll(".box");



boxes.forEach(box=>{


const moveable=new Moveable(document.body,{


target:box,

draggable:true,

resizable:true,

keepRatio:false


});





moveable.on("drag",e=>{


e.target.style.transform=e.transform;


});





moveable.on("resize",e=>{


e.target.style.width=e.width+"px";

e.target.style.height=e.height+"px";


});



});






/* GUARDAR */


document.getElementById("guardar").onclick=()=>{


let diseño={};



boxes.forEach(box=>{


diseño[box.id]={


left:box.style.left,

top:box.style.top,

width:box.style.width,

height:box.style.height,

transform:box.style.transform || ""


};


});




set(
ref(database,"diseño"),

diseño

)
.then(()=>{


alert("Diseño guardado correctamente");


})
.catch(error=>{


alert(error);


});



};



</script>



</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<!-- Librería para mover y cambiar tamaño -->
<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#222;

    overflow:hidden;

}


/* LIENZO VERTICAL 9:16 */

#canvas{

    position:relative;

    width:56.25vh;
    height:100vh;

    max-width:100vw;
    max-height:177.78vw;

    margin:auto;

    background:transparent;

    overflow:hidden;

}


/* Widgets */

.widget{

    position:absolute;

    border:none;

    background:transparent;

}


/* Posiciones iniciales */


#widget1{

    top:5%;
    left:5%;

    width:45%;
    height:15%;

}



#widget2{

    top:5%;
    right:5%;

    width:45%;
    height:15%;

}



#widget3{

    bottom:20%;
    left:5%;

    width:45%;
    height:15%;

}



#widget4{

    bottom:5%;
    right:5%;

    width:45%;
    height:20%;

}



</style>


</head>


<body>



<div id="canvas">


<iframe 
class="widget"
id="widget1"
src="https://tikfinity.zerody.one/widget/topliker?cid=2357749">
</iframe>



<iframe 
class="widget"
id="widget2"
src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749">
</iframe>



<iframe 
class="widget"
id="widget3"
src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749">
</iframe>



<iframe 
class="widget"
id="widget4"
src="https://tikfinity.zerody.one/widget/carousel?cid=2357749">
</iframe>


</div>




<script>


const widgets = document.querySelectorAll(".widget");


widgets.forEach((element)=>{


const moveable = new Moveable(document.body,{

    target: element,

    draggable:true,

    resizable:true,

    keepRatio:false,

});



/* MOVER */

moveable.on("drag", e=>{

    e.target.style.transform = e.transform;

});



/* CAMBIAR TAMAÑO */

moveable.on("resize", e=>{


    e.target.style.width = e.width + "px";

    e.target.style.height = e.height + "px";


});



});


</script>



</body>

</html>

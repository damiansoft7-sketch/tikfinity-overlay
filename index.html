<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>

<style>

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}


/* LIENZO 9:16 */

#canvas{

position:relative;

width:56.25vh;

height:100vh;

max-width:100vw;

max-height:177.78vw;

margin:auto;

}



/* MARCO */

#marco{

position:absolute;

width:100%;
height:100%;

border:3px solid white;

box-sizing:border-box;

pointer-events:none;

z-index:50;

}



/* CAJA DEL ELEMENTO */

.box{

position:absolute;

overflow:hidden;

}





/* CONTENIDO REAL */

.contenido{

position:absolute;

left:0;

top:0;

width:500px;

height:300px;

transform-origin:top left;

}




iframe{

width:500px;

height:300px;

border:0;

background:transparent;

pointer-events:none;

display:block;

}




#guardar{

position:fixed;

top:10px;

left:10px;

padding:12px;

z-index:999;

}


</style>

</head>


<body>


<button id="guardar">

GUARDAR DISEÑO

</button>




<div id="canvas">

<div id="marco"></div>




<div class="box" id="box1"
style="left:20px;top:40px;width:160px;height:90px;">


<div class="contenido">

<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749"></iframe>

</div>


</div>






<div class="box" id="box2"
style="left:180px;top:40px;width:160px;height:90px;">


<div class="contenido">

<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749"></iframe>

</div>


</div>






<div class="box" id="box3"
style="left:20px;top:450px;width:160px;height:90px;">


<div class="contenido">

<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749"></iframe>

</div>


</div>






<div class="box" id="box4"
style="left:180px;top:500px;width:160px;height:120px;">


<div class="contenido">

<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749"></iframe>

</div>


</div>



</div>








<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,

ref,

set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDqdpAchewxlYmGrhFb5WyJKqbL5UP2XsA",

authDomain:"tikfinity-overlay.firebaseapp.com",

databaseURL:"https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId:"tikfinity-overlay",

storageBucket:"tikfinity-overlay.firebasestorage.app",

messagingSenderId:"943639302610",

appId:"1:943639302610:web:5e747094f2f6151b70380b"

};




const app=initializeApp(firebaseConfig);

const database=getDatabase(app);





const boxes=document.querySelectorAll(".box");



boxes.forEach(box=>{


const contenido=box.querySelector(".contenido");



const moveable=new Moveable(document.body,{

target:box,

draggable:true,

resizable:true,

keepRatio:false,

origin:false

});





moveable.on("drag",e=>{


box.style.left=e.left+"px";

box.style.top=e.top+"px";


});






moveable.on("resize",e=>{


box.style.width=e.width+"px";

box.style.height=e.height+"px";



let escalaX=e.width/500;

let escalaY=e.height/300;



contenido.style.transform=
`scale(${escalaX},${escalaY})`;



});



});






document.getElementById("guardar").onclick=()=>{


let diseño={};



boxes.forEach(box=>{


diseño[box.id]={


left:box.style.left,

top:box.style.top,

width:box.style.width,

height:box.style.height


};



});




set(ref(database,"diseño"),diseño)

.then(()=>{

alert("Diseño guardado");

});


};



</script>


</body>

</html>

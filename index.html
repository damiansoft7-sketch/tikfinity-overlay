<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>


html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}



/* LIENZO VERTICAL 9:16 */

#canvas{

position:relative;

width:56.25vh;

height:100vh;

max-width:100vw;

max-height:177.78vw;

margin:auto;

background:transparent;

}



/* BORDE DE GUIA */

#marco{

position:absolute;

left:0;
top:0;

width:100%;

height:100%;

border:3px solid white;

box-sizing:border-box;

pointer-events:none;

z-index:20;

}





/* ELEMENTOS */

.box{

position:absolute;

}





iframe{

width:100%;

height:100%;

border:none;

background:transparent;

pointer-events:none;

}





/* BOTON */

#guardar{

position:fixed;

top:10px;

left:10px;

padding:12px;

z-index:999;

}





</style>


</head>



<body>



<button id="guardar">

GUARDAR DISEÑO

</button>






<div id="canvas">



<div id="marco"></div>






<!-- TOP LIKER -->

<div class="box" id="box1"
style="left:5%;top:5%;width:40%;height:12%;">

<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749"></iframe>

</div>






<!-- SOCIAL ROTATOR -->

<div class="box" id="box2"
style="left:55%;top:5%;width:40%;height:12%;">

<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749"></iframe>

</div>








<!-- USER INFO -->

<div class="box" id="box3"
style="left:5%;top:75%;width:40%;height:12%;">

<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749"></iframe>

</div>







<!-- CAROUSEL -->

<div class="box" id="box4"
style="left:55%;top:75%;width:40%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749"></iframe>

</div>






</div>








<script type="module">



import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,

ref,

set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";








const firebaseConfig = {


apiKey: "AIzaSyDqdpAchewxlYmGrhFb5WyJKqbL5UP2XsA",

authDomain: "tikfinity-overlay.firebaseapp.com",

databaseURL: "https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId: "tikfinity-overlay",

storageBucket: "tikfinity-overlay.firebasestorage.app",

messagingSenderId: "943639302610",

appId: "1:943639302610:web:5e747094f2f6151b70380b"


};






const app = initializeApp(firebaseConfig);


const database = getDatabase(app);







const boxes=document.querySelectorAll(".box");








boxes.forEach(box=>{



const moveable=new Moveable(document.body,{


target:box,


draggable:true,


resizable:true,


keepRatio:false


});






moveable.on("drag",e=>{


e.target.style.left=e.left+"px";

e.target.style.top=e.top+"px";


});








moveable.on("resize",e=>{


e.target.style.width=e.width+"px";

e.target.style.height=e.height+"px";


});




});









document.getElementById("guardar").onclick=()=>{



let diseño={};






boxes.forEach(box=>{



diseño[box.id]={


left:box.style.left,

top:box.style.top,

width:box.style.width,

height:box.style.height


};



});







set(ref(database,"diseño"),diseño)



.then(()=>{


alert("✅ Diseño guardado correctamente");


})



.catch(error=>{


alert("Error: "+error.message);


});



};






</script>



</body>

</html>

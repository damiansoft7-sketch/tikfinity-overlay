<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>


html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}




#vista{

width:100vw;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}




/* LIENZO REAL 9:16 */

#canvas{

position:relative;

width:1080px;

height:1920px;

transform-origin:center;

}





/* IMAGEN GUIA */

#guia{

position:absolute;

left:0;

top:0;

width:1080px;

height:1920px;

object-fit:fill;

z-index:0;

pointer-events:none;

}





/* BORDE */

#marco{

position:absolute;

left:0;

top:0;

width:100%;

height:100%;

border:8px solid white;

box-sizing:border-box;

pointer-events:none;

z-index:20;

}





/* ZONA SEGURA */

#zona{

position:absolute;

left:50px;

top:150px;

width:980px;

height:1520px;

border:5px dashed rgba(255,255,255,.5);

pointer-events:none;

z-index:15;

}





.box{

position:absolute;

overflow:hidden;

z-index:10;

}




iframe{

width:100%;

height:100%;

border:none;

background:transparent;

pointer-events:none;

}





#guardar{

position:fixed;

top:15px;

left:15px;

z-index:999;

padding:12px;

}




</style>

</head>




<body>



<button id="guardar">

GUARDAR DISEÑO

</button>




<div id="vista">


<div id="canvas">



<img id="guia" src="guia.jpeg">



<div id="marco"></div>

<div id="zona"></div>






<div class="box" id="box1"
style="left:50px;top:200px;width:400px;height:150px;">


<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749"></iframe>


</div>





<div class="box" id="box2"
style="left:630px;top:200px;width:400px;height:150px;">


<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749"></iframe>


</div>





<div class="box" id="box3"
style="left:50px;top:1500px;width:400px;height:150px;">


<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749"></iframe>


</div>





<div class="box" id="box4"
style="left:630px;top:1550px;width:400px;height:200px;">


<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749"></iframe>


</div>



</div>

</div>







<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,

ref,

set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDqdpAchewxlYmGrhFb5WyJKqbL5UP2XsA",

authDomain:"tikfinity-overlay.firebaseapp.com",

databaseURL:"https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId:"tikfinity-overlay",

storageBucket:"tikfinity-overlay.firebasestorage.app",

messagingSenderId:"943639302610",

appId:"1:943639302610:web:5e747094f2f6151b70380b"

};





initializeApp(firebaseConfig);


const database=getDatabase();





// AJUSTAR EDITOR AL MONITOR


function ajustarEditor(){


const canvas=document.getElementById("canvas");


let escala=Math.min(

(window.innerWidth-100)/1080,

(window.innerHeight-100)/1920

);



canvas.style.transform=`scale(${escala})`;


}



window.addEventListener("resize",ajustarEditor);


ajustarEditor();







// MOVER Y CAMBIAR TAMAÑO


const boxes=document.querySelectorAll(".box");



boxes.forEach(box=>{


new Moveable(document.body,{

target:box,

draggable:true,

resizable:true,

origin:false

})



.on("drag",e=>{


box.style.left=e.left+"px";

box.style.top=e.top+"px";


})



.on("resize",e=>{


box.style.width=e.width+"px";

box.style.height=e.height+"px";


});


});







// GUARDAR


document.getElementById("guardar").onclick=()=>{


let diseño={};



boxes.forEach(box=>{


diseño[box.id]={


left:box.style.left,

top:box.style.top,

width:box.style.width,

height:box.style.height


};



});





set(ref(database,"diseño"),diseño)

.then(()=>{


alert("✅ Diseño guardado correctamente");


});



};



</script>



</body>

</html>

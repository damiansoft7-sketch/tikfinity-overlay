<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}


/* LIENZO 9:16 */

#canvas{

position:relative;

width:56.25vh;
height:100vh;

max-width:100vw;

max-height:177.78vw;

margin:auto;

}



/* MARCO */

#marco{

position:absolute;

width:100%;

height:100%;

border:3px solid white;

box-sizing:border-box;

pointer-events:none;

z-index:20;

}



/* CAJAS */

.box{

position:absolute;

}



iframe{

width:100%;

height:100%;

border:none;

background:transparent;

pointer-events:none;

}




/* BOTON */

#guardar{

position:fixed;

top:10px;

left:10px;

padding:12px;

font-size:16px;

z-index:999;

}



</style>

</head>



<body>



<button id="guardar">
GUARDAR EN FIREBASE
</button>




<div id="canvas">


<div id="marco"></div>



<div class="box" id="box1"
style="left:5%;top:5%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749">
</iframe>

</div>




<div class="box" id="box2"
style="right:5%;top:5%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749">
</iframe>

</div>




<div class="box" id="box3"
style="left:5%;bottom:20%;width:45%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749">
</iframe>

</div>




<div class="box" id="box4"
style="right:5%;bottom:5%;width:45%;height:20%;">

<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749">
</iframe>

</div>


</div>





<script type="module">


// FIREBASE IMPORT

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getDatabase,
ref,
set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




// CONFIGURACIÓN FIREBASE

const firebaseConfig = {


apiKey: "AIzaSyDqdpAchewxlYmGrhFb5WyJKbL5UP2XsA",

authDomain: "tikfinity-overlay.firebaseapp.com",

databaseURL: "https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId: "tikfinity-overlay",

storageBucket: "tikfinity-overlay.firebasestorage.app",

messagingSenderId: "943639302610",

appId: "1:943639302610:web:5e747094f2f6151b70380b"

};




// INICIAR FIREBASE

const app = initializeApp(firebaseConfig);


const database = getDatabase(app);





// EDITOR

const boxes=document.querySelectorAll(".box");



boxes.forEach((box)=>{


const moveable=new Moveable(document.body,{

target:box,

draggable:true,

resizable:true,

keepRatio:false

});





// MOVER

moveable.on("drag",e=>{


e.target.style.transform=e.transform;


});





// CAMBIAR TAMAÑO

moveable.on("resize",e=>{


e.target.style.width=e.width+"px";

e.target.style.height=e.height+"px";


});



});







// GUARDAR EN FIREBASE


document.getElementById("guardar").onclick=()=>{


let diseño={};



boxes.forEach(box=>{


diseño[box.id]={


left:box.style.left,

top:box.style.top,

width:box.style.width,

height:box.style.height,

transform:box.style.transform || ""

};


});




set(ref(database,"diseño"),diseño)

.then(()=>{


alert("✅ Diseño guardado en Firebase");


})

.catch((error)=>{


alert("Error: "+error);


});


};



</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>

<style>

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

font-family:Arial;

}



#vista{

width:100vw;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}



#canvas{

position:relative;

width:1080px;
height:1920px;

transform-origin:center;

}



#guia{

position:absolute;

left:0;
top:0;

width:1080px;
height:1920px;

pointer-events:none;

z-index:0;

}



.box{

position:absolute;

overflow:hidden;

z-index:10;

border:2px solid transparent;

}



.box.selected{

border:3px solid red;

}



iframe{

width:100%;
height:100%;

border:none;

pointer-events:none;

background:transparent;

}



#menu{

position:fixed;

top:15px;
left:15px;

z-index:999;

display:flex;

gap:10px;

}



button{

padding:12px;

cursor:pointer;

font-size:16px;

}



#marco{

position:absolute;

width:100%;
height:100%;

border:8px solid white;

box-sizing:border-box;

pointer-events:none;

z-index:20;

}



#zona{

position:absolute;

left:50px;
top:150px;

width:980px;
height:1520px;

border:5px dashed rgba(255,255,255,.5);

pointer-events:none;

z-index:15;

}



</style>

</head>


<body>



<div id="menu">

<button id="agregar">
➕ Añadir Widget
</button>


<button id="eliminar">
🗑 Eliminar
</button>


<button id="guardar">
💾 Guardar
</button>


</div>





<div id="vista">

<div id="canvas">


<img id="guia" src="guia.jpeg">


<div id="zona"></div>

<div id="marco"></div>




</div>

</div>






<script type="module">


import {

initializeApp

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,

ref,

set,

get,

remove

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDqdpAchewxlYmGrhFb5WyJK7U5LP2XsA",

authDomain:"tikfinity-overlay.firebaseapp.com",

databaseURL:"https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId:"tikfinity-overlay",

storageBucket:"tikfinity-overlay.firebasestorage.app",

messagingSenderId:"943639302610",

appId:"1:943639302610:web:5e747094f2f6151b70380b"

};



initializeApp(firebaseConfig);


const database=getDatabase();





const canvas=document.getElementById("canvas");


let seleccionado=null;

let contador=1;





function ajustarEditor(){


let escala=Math.min(

(window.innerWidth-100)/1080,

(window.innerHeight-100)/1920

);


canvas.style.transform=`scale(${escala})`;

}


window.addEventListener("resize",ajustarEditor);

ajustarEditor();






function activarMoveable(box){


const move=new Moveable(document.body,{

target:box,

draggable:true,

resizable:true,

origin:false

});




move.on("drag",e=>{


box.style.left=e.left+"px";

box.style.top=e.top+"px";


});



move.on("resize",e=>{


box.style.width=e.width+"px";

box.style.height=e.height+"px";


});



box.onclick=(e)=>{


e.stopPropagation();


document.querySelectorAll(".box")
.forEach(b=>b.classList.remove("selected"));


box.classList.add("selected");


seleccionado=box;


move.target=box;


};


}







function crearWidget(id,url){



const box=document.createElement("div");


box.className="box";


box.id=id;


box.style.left="100px";

box.style.top="300px";

box.style.width="400px";

box.style.height="150px";



box.dataset.url=url;




const iframe=document.createElement("iframe");


iframe.src=url;


box.appendChild(iframe);



canvas.appendChild(box);



activarMoveable(box);



}







// CARGAR DISEÑO


const datos=await get(ref(database,"diseño"));



if(datos.exists()){


const diseño=datos.val();



Object.keys(diseño).forEach(id=>{


crearWidget(id,diseño[id].url);



const box=document.getElementById(id);


box.style.left=diseño[id].left;

box.style.top=diseño[id].top;

box.style.width=diseño[id].width;

box.style.height=diseño[id].height;



});



}





// AÑADIR


document.getElementById("agregar").onclick=()=>{


let url=prompt(
"Pega URL del widget TikFinity:"
);


if(!url)return;



contador++;


crearWidget(
"box"+contador,
url
);



};







// ELIMINAR


document.getElementById("eliminar").onclick=()=>{


if(!seleccionado)return;



seleccionado.remove();


seleccionado=null;


};







// GUARDAR


document.getElementById("guardar").onclick=()=>{


let diseño={};



document.querySelectorAll(".box")
.forEach(box=>{


diseño[box.id]={


url:box.dataset.url,

left:box.style.left,

top:box.style.top,

width:box.style.width,

height:box.style.height


};


});



set(
ref(database,"diseño"),
diseño

)
.then(()=>alert("Diseño guardado"));



};



</script>



</body>

</html>

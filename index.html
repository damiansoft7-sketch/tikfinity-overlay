<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;700&family=Press+Start+2P&family=Rajdhani:wght@400;700&family=Exo+2:wght@400;700&family=Roboto:wght@400;700&family=Anton&family=Bangers&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:#222;
  overflow:hidden;
  font-family:sans-serif;
}
#vista{
  width:100vw; height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
#canvas{
  position:relative;
  width:1080px; height:1920px;
  transform-origin:center;
}
#guia{
  position:absolute;
  left:0; top:0;
  width:1080px; height:1920px;
  object-fit:fill;
  z-index:0;
  pointer-events:none;
}
#marco{
  position:absolute;
  left:0; top:0;
  width:100%; height:100%;
  border:8px solid white;
  box-sizing:border-box;
  pointer-events:none;
  z-index:20;
}
#zona{
  position:absolute;
  left:50px; top:150px;
  width:980px; height:1520px;
  border:5px dashed rgba(255,255,255,.5);
  pointer-events:none;
  z-index:15;
}
.box{
  position:absolute;
  overflow:hidden;
  z-index:10;
}
.box.seleccionado{
  outline:4px solid #00e5ff;
  outline-offset:2px;
}
iframe{
  position:absolute;
  left:0; top:0;
  border:none;
  background:transparent;
  pointer-events:none;
  transform-origin:top left;
}
.texto-contenido{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-sizing:border-box;
  padding:10px;
  font-size:48px;
  font-weight:bold;
  word-break:break-word;
  line-height:1.2;
  /* Los estilos reales vienen del dataset de la caja */
}
#panel{
  position:fixed;
  top:15px; left:15px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#panel button{
  padding:12px 16px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}
#guardar{ background:#2196F3; color:white; }
#agregar{ background:#4CAF50; color:white; }
#agregarTexto{ background:#000; color:white; border:2px solid white; }
#agregarImagen{ background:#009688; color:white; }
#test{ background:#FF9800; color:white; }
#reset{ background:#795548; color:white; }
#eliminar{ background:#f44336; color:white; }

.imagen-contenido{
  width:100%; height:100%;
  display:block;
}
.box.oculta-en-editor{
  opacity:0.35;
}
.badge-oculta{
  position:absolute;
  top:4px; left:4px;
  background:#f44336;
  color:white;
  font-size:10px;
  font-weight:bold;
  padding:2px 6px;
  border-radius:4px;
  z-index:30;
  pointer-events:none;
  display:none;
}
.btn-ojo{
  position:absolute;
  top:4px; right:4px;
  width:26px; height:26px;
  border-radius:50%;
  background:rgba(0,0,0,0.65);
  color:white;
  border:none;
  cursor:pointer;
  font-size:14px;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

/* Panel de estilos de texto (derecha) */
#panelEstilos{
  position:fixed;
  top:0; right:0;
  width:230px;
  height:100vh;
  background:#1a1a1a;
  border-left:1px solid #333;
  z-index:999;
  display:none;
  flex-direction:column;
  overflow-y:auto;
}
#panelEstilosHeader{
  padding:12px 14px 10px;
  font-size:13px;
  font-weight:bold;
  color:#ccc;
  border-bottom:1px solid #333;
  background:#111;
  flex-shrink:0;
}
#panelEstilosBody{
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:13px;
  flex:1;
}
.pe-grupo{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.pe-label{
  font-size:10px;
  color:#888;
  letter-spacing:0.07em;
  text-transform:uppercase;
}
.pe-row2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.pe-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }

#panelEstilos select,
#panelEstilos input[type="text"]{
  width:100%;
  font-size:12px;
  padding:5px 7px;
  border-radius:5px;
  border:1px solid #444;
  background:#2a2a2a;
  color:#eee;
  box-sizing:border-box;
}
#panelEstilos input[type="range"]{
  width:100%;
  accent-color:#2196F3;
}
#panelEstilos input[type="color"]{
  width:100%;
  height:30px;
  padding:2px 3px;
  border:1px solid #444;
  border-radius:5px;
  cursor:pointer;
  background:#2a2a2a;
  box-sizing:border-box;
}
.pe-range-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.pe-range-val{
  font-size:11px;
  color:#aaa;
  min-width:30px;
  text-align:right;
  flex-shrink:0;
}
.pe-btn{
  padding:5px 4px;
  font-size:12px;
  font-weight:bold;
  border:1px solid #444;
  border-radius:5px;
  background:#2a2a2a;
  color:#ccc;
  cursor:pointer;
  text-align:center;
  transition:background 0.1s;
}
.pe-btn:hover{ background:#333; }
.pe-btn.activo{ background:#2196F3; color:#fff; border-color:#2196F3; }
.pe-divider{
  border:none;
  border-top:1px solid #333;
  margin:2px 0;
}
.pe-preview-fondo{
  height:26px;
  border-radius:5px;
  border:1px solid #444;
  display:flex;
  align-items:center;
  padding:0 8px;
  font-size:10px;
  color:rgba(255,255,255,0.5);
  letter-spacing:0.04em;
  background: repeating-linear-gradient(45deg, #555 0px, #555 4px, #333 4px, #333 8px);
  position:relative;
  overflow:hidden;
}
.pe-preview-fill{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  padding:0 8px;
  font-size:10px;
  letter-spacing:0.04em;
  color:rgba(255,255,255,0.6);
}
#panelEstilosAplicar{
  margin:0 14px 14px;
  padding:10px;
  font-size:13px;
  font-weight:bold;
  border:none;
  border-radius:6px;
  background:#2196F3;
  color:#fff;
  cursor:pointer;
  flex-shrink:0;
}
#panelEstilosAplicar:hover{ background:#1976D2; }

/* Modales */
.modal-fondo{
  display:none;
  position:fixed;
  left:0; top:0; width:100%; height:100%;
  background:rgba(0,0,0,.6);
  z-index:2000;
  align-items:center;
  justify-content:center;
}
.modal-caja{
  background:white;
  border-radius:10px;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:12px;
  font-family:sans-serif;
}
.modal-caja h3{ margin:0; }
.modal-caja select, .modal-caja input{ padding:8px; font-size:16px; }
.modal-botones{ display:flex; gap:8px; justify-content:flex-end; }
.modal-botones button{
  padding:10px 14px; border:none; border-radius:6px;
  font-weight:bold; cursor:pointer;
}
.modal-btn-confirmar{ background:#4CAF50; color:white; }
.modal-btn-cancelar{ background:#ccc; }

#modalCaja{ width:300px; }
#modalEditarCaja{ width:320px; }
#modalEditarCaja label{ display:flex; align-items:center; gap:8px; font-size:15px; }
</style>
</head>
<body>

<div id="panel">
  <button id="guardar">GUARDAR DISEÑO</button>
  <button id="agregar">➕ AGREGAR ELEMENTO</button>
  <button id="agregarTexto">🔤 AGREGAR TEXTO</button>
  <button id="agregarImagen">🖼 AGREGAR IMAGEN</button>
  <button id="eliminar">🗑 ELIMINAR SELECCIONADO</button>
</div>

<!-- PANEL DE ESTILOS DE TEXTO (derecha) -->
<div id="panelEstilos">
  <div id="panelEstilosHeader">🎨 Estilos de texto</div>
  <div id="panelEstilosBody">

    <div class="pe-grupo">
      <span class="pe-label">Fuente</span>
      <select id="pe-font">
        <option value="sans-serif">Sans-serif</option>
        <option value="'Bebas Neue'">Bebas Neue</option>
        <option value="'Oswald'">Oswald</option>
        <option value="'Press Start 2P'">Press Start 2P</option>
        <option value="'Rajdhani'">Rajdhani</option>
        <option value="'Exo 2'">Exo 2</option>
        <option value="'Roboto'">Roboto</option>
        <option value="'Anton'">Anton</option>
        <option value="'Bangers'">Bangers</option>
        <option value="'Orbitron'">Orbitron</option>
      </select>
    </div>

    <div class="pe-grupo">
      <span class="pe-label">Tamaño</span>
      <div class="pe-range-row">
        <input type="range" id="pe-size" min="12" max="200" step="1" value="48">
        <span class="pe-range-val" id="pe-size-val">48px</span>
      </div>
    </div>

    <div class="pe-grupo">
      <span class="pe-label">Estilo</span>
      <div class="pe-row3">
        <button class="pe-btn" id="pe-btn-bold" onclick="peToggle('bold')"><b>B</b></button>
        <button class="pe-btn" id="pe-btn-italic" onclick="peToggle('italic')" style="font-style:italic">I</button>
        <button class="pe-btn" id="pe-btn-shadow" onclick="peToggle('shadow')">S↗</button>
      </div>
    </div>

    <div class="pe-grupo">
      <span class="pe-label">Alineación</span>
      <div class="pe-row3">
        <button class="pe-btn" id="pe-btn-left"   onclick="peAlign('left')">⬅</button>
        <button class="pe-btn" id="pe-btn-center" onclick="peAlign('center')">↔</button>
        <button class="pe-btn" id="pe-btn-right"  onclick="peAlign('right')">➡</button>
      </div>
    </div>

    <div class="pe-grupo">
      <span class="pe-label">Color del texto</span>
      <input type="color" id="pe-color" value="#ffffff">
    </div>

    <hr class="pe-divider">

    <div class="pe-grupo">
      <span class="pe-label">Color de fondo</span>
      <div class="pe-row2">
        <input type="color" id="pe-bgcolor" value="#000000">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span style="font-size:10px;color:#888;">Opacidad</span>
          <div class="pe-range-row">
            <input type="range" id="pe-alpha" min="0" max="100" step="1" value="100" style="flex:1">
            <span class="pe-range-val" id="pe-alpha-val">100%</span>
          </div>
        </div>
      </div>
      <div class="pe-preview-fondo">
        <div class="pe-preview-fill" id="pe-preview-fill">Vista previa fondo</div>
      </div>
    </div>

    <div class="pe-grupo">
      <span class="pe-label">Alineación vertical</span>
      <div class="pe-row3">
        <button class="pe-btn" id="pe-btn-valign-top"    onclick="peVAlign('flex-start')">⬆</button>
        <button class="pe-btn" id="pe-btn-valign-center" onclick="peVAlign('center')">⬛</button>
        <button class="pe-btn" id="pe-btn-valign-bottom" onclick="peVAlign('flex-end')">⬇</button>
      </div>
    </div>

    <hr class="pe-divider">

    <div class="pe-grupo">
      <span class="pe-label">Animación</span>
      <select id="pe-anim-modo">
        <option value="ninguna">Ninguna</option>
        <option value="marquee">Texto corredizo (marquee)</option>
        <option value="palabras">Palabras cambiantes (fade)</option>
      </select>
    </div>

    <div class="pe-grupo" id="pe-anim-marquee-grupo" style="display:none;">
      <span class="pe-label">Velocidad (px/seg)</span>
      <div class="pe-range-row">
        <input type="range" id="pe-anim-velocidad" min="20" max="400" step="10" value="120">
        <span class="pe-range-val" id="pe-anim-velocidad-val">120</span>
      </div>
    </div>

    <div class="pe-grupo" id="pe-anim-palabras-grupo" style="display:none;">
      <span class="pe-label">Palabras (una por línea)</span>
      <textarea id="pe-anim-palabras" rows="4" style="width:100%; box-sizing:border-box; font-size:12px; padding:6px 7px; border-radius:5px; border:1px solid #444; background:#2a2a2a; color:#eee; resize:vertical;" placeholder="Palabra 1&#10;Palabra 2&#10;Palabra 3"></textarea>
      <span class="pe-label" style="margin-top:4px;">Intervalo (ms)</span>
      <div class="pe-range-row">
        <input type="range" id="pe-anim-intervalo" min="500" max="6000" step="100" value="2000">
        <span class="pe-range-val" id="pe-anim-intervalo-val">2000</span>
      </div>
    </div>

  </div>
  <button id="panelEstilosAplicar">✅ Aplicar estilos</button>
</div>

<div id="vista">
  <div id="canvas">
    <img id="guia" src="guia.jpeg">
    <div id="marco"></div>
    <div id="zona"></div>
  </div>
</div>

<!-- MODAL EDITAR TEXTO -->
<div id="modalEditarFondo" class="modal-fondo">
  <div id="modalEditarCaja" class="modal-caja">
    <h3>Editar caja de texto</h3>
    <label for="modalEditarTexto">Texto:</label>
    <input type="text" id="modalEditarTexto">
    <div class="modal-botones">
      <button id="modalEditarCancelar" class="modal-btn-cancelar">Cancelar</button>
      <button id="modalEditarGuardar" class="modal-btn-confirmar">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL AGREGAR / EDITAR IMAGEN -->
<div id="modalImagenFondo" class="modal-fondo">
  <div id="modalImagenCaja" class="modal-caja">
    <h3 id="modalImagenTitulo">Agregar imagen</h3>
    <label for="modalImagenArchivo">Elegir archivo de imagen:</label>
    <input type="file" id="modalImagenArchivo" accept="image/*">
    <div id="modalImagenPreviewWrap" style="display:none; text-align:center;">
      <img id="modalImagenPreview" style="max-width:100%; max-height:180px; border:1px solid #ccc; border-radius:6px;">
    </div>
    <label for="modalImagenAjuste">Ajuste de la imagen en la caja:</label>
    <select id="modalImagenAjuste">
      <option value="contain">Contener (se ve completa, puede dejar espacios)</option>
      <option value="cover">Cubrir (llena la caja, puede recortar)</option>
      <option value="fill">Estirar (llena exacto, puede deformar)</option>
    </select>
    <div class="modal-botones">
      <button id="modalImagenCancelar" class="modal-btn-cancelar">Cancelar</button>
      <button id="modalImagenGuardar" class="modal-btn-confirmar">Guardar</button>
    </div>
  </div>
</div>

<script type="module">
import { database, ref, set, get, remove, onValue } from "./firebase.js";
import { aplicarAnimacion, actualizarValorAnimado, detenerAnimacion } from "./animaciones.js";

const canvas = document.getElementById("canvas");

const cajasPorDefecto = {
  box1: { tipo:"iframe", left:"50px",  top:"200px",  width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/topliker?cid=2357749" },
  box2: { tipo:"iframe", left:"630px", top:"200px",  width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749" },
  box3: { tipo:"iframe", left:"50px",  top:"1500px", width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/userinfo?cid=2357749" },
  box4: { tipo:"iframe", left:"630px", top:"1550px", width:"400px", height:"200px", baseWidth:400, baseHeight:200, link:"https://tikfinity.zerody.one/widget/carousel?cid=2357749" }
};

// ═══════════════════════════════════════════════════════
//  PANEL DE ESTILOS — estado y lógica
// ═══════════════════════════════════════════════════════
const panelEstilos = document.getElementById("panelEstilos");
let cajaEnEstilos = null;

// Estado temporal del panel (se aplica al hacer click en "Aplicar estilos")
const pe = {
  font: "sans-serif",
  size: 48,
  bold: false,
  italic: false,
  shadow: false,
  color: "#ffffff",
  bgcolor: "#000000",
  alpha: 100,
  align: "center",
  valign: "center",
  animModo: "ninguna",
  animVelocidad: 120,
  animPalabras: [],
  animIntervalo: 2000
};

// Convierte un valor de dataset a número, con fallback seguro si es NaN/undefined
function numeroSeguro(valor, porDefecto){
  const n = parseInt(valor);
  return Number.isFinite(n) ? n : porDefecto;
}

function hexToRgb(hex){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function actualizarPreviewFondo(){
  const {r,g,b} = hexToRgb(pe.bgcolor);
  const a = pe.alpha / 100;
  const fill = document.getElementById("pe-preview-fill");
  fill.style.background = pe.alpha === 0 ? "transparent" : `rgba(${r},${g},${b},${a})`;
  fill.style.color = pe.alpha < 30 ? "rgba(200,200,200,0.6)" : "rgba(255,255,255,0.7)";
}

function cargarPanelDesdeDataset(box){
  const d = box.dataset;
  pe.font    = d.esFont    || "sans-serif";
  pe.size    = parseInt(d.esSize)  || 48;
  pe.bold    = d.esBold    === "true";
  pe.italic  = d.esItalic  === "true";
  pe.shadow  = d.esShadow  === "true";
  pe.color   = d.esColor   || "#ffffff";
  pe.bgcolor = d.esBgcolor || "#000000";
  pe.alpha   = parseInt(d.esAlpha) ?? 100;
  pe.align   = d.esAlign   || "center";
  pe.valign  = d.esValign  || "center";
  pe.animModo      = d.animModo || "ninguna";
  pe.animVelocidad = numeroSeguro(d.animVelocidad, 120);
  pe.animPalabras  = d.animPalabras ? JSON.parse(d.animPalabras) : [];
  pe.animIntervalo = numeroSeguro(d.animIntervalo, 2000);

  document.getElementById("pe-font").value   = pe.font;
  document.getElementById("pe-size").value   = pe.size;
  document.getElementById("pe-size-val").textContent = pe.size + "px";
  document.getElementById("pe-color").value  = pe.color;
  document.getElementById("pe-bgcolor").value = pe.bgcolor;
  document.getElementById("pe-alpha").value  = pe.alpha;
  document.getElementById("pe-alpha-val").textContent = pe.alpha + "%";

  ["bold","italic","shadow"].forEach(k=>{
    document.getElementById("pe-btn-"+k).classList.toggle("activo", pe[k]);
  });
  ["left","center","right"].forEach(k=>{
    document.getElementById("pe-btn-"+k).classList.toggle("activo", pe.align === k);
  });
  ["flex-start","center","flex-end"].forEach(k=>{
    const map = {"flex-start":"top","center":"center","flex-end":"bottom"};
    document.getElementById("pe-btn-valign-"+map[k]).classList.toggle("activo", pe.valign === k);
  });
  actualizarPreviewFondo();

  document.getElementById("pe-anim-modo").value = pe.animModo;
  document.getElementById("pe-anim-velocidad").value = pe.animVelocidad;
  document.getElementById("pe-anim-velocidad-val").textContent = pe.animVelocidad;
  document.getElementById("pe-anim-palabras").value = pe.animPalabras.join("\n");
  document.getElementById("pe-anim-intervalo").value = pe.animIntervalo;
  document.getElementById("pe-anim-intervalo-val").textContent = pe.animIntervalo;
  actualizarVisibilidadGruposAnim();
}

function actualizarVisibilidadGruposAnim(){
  document.getElementById("pe-anim-marquee-grupo").style.display  = pe.animModo === "marquee"  ? "flex" : "none";
  document.getElementById("pe-anim-palabras-grupo").style.display = pe.animModo === "palabras" ? "flex" : "none";
}

function aplicarEstilosABox(box){
  const d = box.dataset;
  d.esFont    = pe.font;
  d.esSize    = pe.size;
  d.esBold    = pe.bold;
  d.esItalic  = pe.italic;
  d.esShadow  = pe.shadow;
  d.esColor   = pe.color;
  d.esBgcolor = pe.bgcolor;
  d.esAlpha   = pe.alpha;
  d.esAlign   = pe.align;
  d.esValign  = pe.valign;
  d.animModo      = pe.animModo;
  d.animVelocidad = pe.animVelocidad;
  d.animPalabras  = JSON.stringify(pe.animPalabras);
  d.animIntervalo = pe.animIntervalo;

  const {r,g,b} = hexToRgb(pe.bgcolor);
  const a = pe.alpha / 100;
  const contenido = box.querySelector(".texto-contenido");
  if(!contenido) return;

  contenido.style.fontFamily  = pe.font;
  contenido.style.fontSize    = pe.size + "px";
  contenido.style.fontWeight  = pe.bold   ? "700" : "400";
  contenido.style.fontStyle   = pe.italic ? "italic" : "normal";
  contenido.style.textShadow  = pe.shadow ? "2px 2px 8px rgba(0,0,0,0.9)" : "none";
  contenido.style.color       = pe.color;
  contenido.style.background  = pe.alpha === 0 ? "transparent" : `rgba(${r},${g},${b},${a})`;
  contenido.style.textAlign   = pe.align;
  contenido.style.justifyContent = pe.align === "left" ? "flex-start" : pe.align === "right" ? "flex-end" : "center";
  contenido.style.alignItems  = pe.valign;

  // Preview de la animación directamente en el editor
  aplicarAnimacion(box, contenido, { modo: pe.animModo, velocidad: pe.animVelocidad, palabras: pe.animPalabras, intervalo: pe.animIntervalo }, contenido.textContent);
}

// Igual que aplicarEstilosABox, pero lee el estilo guardado de LA PROPIA caja
// (box.dataset), sin tocar ni depender del panel global "pe". Se usa al crear/
// restaurar una caja desde Firebase, para no pisarla con lo que haya quedado
// en el panel de estilos de otra caja distinta.
function aplicarEstilosDesdeDataset(box){
  const d = box.dataset;
  const contenido = box.querySelector(".texto-contenido");
  if(!contenido) return;

  const font    = d.esFont    || "sans-serif";
  const size    = numeroSeguro(d.esSize, 48);
  const bold    = d.esBold    === "true";
  const italic  = d.esItalic  === "true";
  const shadow  = d.esShadow  === "true";
  const color   = d.esColor   || "#ffffff";
  const bgcolor = d.esBgcolor || "#000000";
  const alpha   = numeroSeguro(d.esAlpha, 100);
  const align   = d.esAlign   || "center";
  const valign  = d.esValign  || "center";

  const {r,g,b} = hexToRgb(bgcolor);
  const a = alpha / 100;

  contenido.style.fontFamily  = font;
  contenido.style.fontSize    = size + "px";
  contenido.style.fontWeight  = bold   ? "700" : "400";
  contenido.style.fontStyle   = italic ? "italic" : "normal";
  contenido.style.textShadow  = shadow ? "2px 2px 8px rgba(0,0,0,0.9)" : "none";
  contenido.style.color       = color;
  contenido.style.background  = alpha === 0 ? "transparent" : `rgba(${r},${g},${b},${a})`;
  contenido.style.textAlign   = align;
  contenido.style.justifyContent = align === "left" ? "flex-start" : align === "right" ? "flex-end" : "center";
  contenido.style.alignItems  = valign;
}

//  MOVEABLES Y CAJAS
// ═══════════════════════════════════════════════════════
const moveables = {};
let seleccionada = null;
const BASE_WIDTH_DEFAULT = 400;
const BASE_HEIGHT_DEFAULT = 150;

function ajustarEditor(){
  let escala = Math.min(
    (window.innerWidth - 260) / 1080,
    (window.innerHeight - 100) / 1920
  );
  canvas.style.transform = `scale(${escala})`;
}
let resizeEditorPendiente = false;
window.addEventListener("resize", ()=>{
  if(resizeEditorPendiente) return;
  resizeEditorPendiente = true;
  requestAnimationFrame(()=>{ ajustarEditor(); resizeEditorPendiente = false; });
});
ajustarEditor();

function actualizarEscalaContenido(box){
  const iframe = box.querySelector("iframe");
  if(!iframe) return;
  const baseWidth = parseFloat(box.dataset.baseWidth) || 400;
  const baseHeight = parseFloat(box.dataset.baseHeight) || 150;
  const width = parseFloat(box.style.width);
  const height = parseFloat(box.style.height);
  iframe.style.width = baseWidth + "px";
  iframe.style.height = baseHeight + "px";
  iframe.style.transform = `scale(${width/baseWidth}, ${height/baseHeight})`;
}

// ── CAJA IFRAME ──
function crearBoxIframe(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  box.dataset.tipo = "iframe";
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;
  box.dataset.baseWidth = datos.baseWidth || BASE_WIDTH_DEFAULT;
  box.dataset.baseHeight = datos.baseHeight || BASE_HEIGHT_DEFAULT;
  const iframe = document.createElement("iframe");
  iframe.src = datos.link || "";
  box.appendChild(iframe);
  canvas.appendChild(box);
  actualizarEscalaContenido(box);
  box.addEventListener("click", e=>{ e.stopPropagation(); seleccionarBox(box); });
  box.addEventListener("dblclick", e=>{ e.stopPropagation(); editarBoxIframe(box); });
  activarMoveable(box);
  return box;
}

function editarBoxIframe(box){
  const nuevoAncho = prompt("Ancho NATURAL del widget (px):", box.dataset.baseWidth);
  if(nuevoAncho === null) return;
  const nuevoAlto = prompt("Alto NATURAL del widget (px):", box.dataset.baseHeight);
  if(nuevoAlto === null) return;
  box.dataset.baseWidth = parseFloat(nuevoAncho) || box.dataset.baseWidth;
  box.dataset.baseHeight = parseFloat(nuevoAlto) || box.dataset.baseHeight;
  actualizarEscalaContenido(box);
}

// ── CAJA IMAGEN ──
// Visibilidad en vivo: ruta aparte "visibilidadImagen/<id>", igual patrón que "textoLive/"
// para texto en vivo. El botón del ojito escribe ahí directo (sin necesitar GUARDAR DISEÑO)
// y el overlay.html ya está escuchando ese cambio al instante.
const visibilidadImagenLocal = {}; // cache local id -> boolean visible

function actualizarAparienciaOculta(box, visible){
  box.classList.toggle("oculta-en-editor", !visible);
  const badge = box.querySelector(".badge-oculta");
  if(badge) badge.style.display = visible ? "none" : "block";
}

function crearBoxImagen(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  box.dataset.tipo = "imagen";
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;
  box.dataset.ajuste = datos.ajuste || "contain";
  box.dataset.src = datos.src || "";

  const img = document.createElement("img");
  img.className = "imagen-contenido";
  img.src = datos.src || "";
  img.style.objectFit = box.dataset.ajuste;
  box.appendChild(img);

  const badge = document.createElement("div");
  badge.className = "badge-oculta";
  badge.textContent = "OCULTA EN VIVO";
  box.appendChild(badge);

  const btnOjo = document.createElement("button");
  btnOjo.type = "button";
  btnOjo.className = "btn-ojo";
  btnOjo.title = "Mostrar/ocultar en vivo";
  btnOjo.textContent = "👁";
  // Evitar que el click/drag del ojito interfiera con Moveable o con la selección de caja
  btnOjo.addEventListener("mousedown", e=> e.stopPropagation());
  btnOjo.addEventListener("click", e=>{
    e.stopPropagation();
    const visibleActual = visibilidadImagenLocal[id] !== false;
    const nuevoValor = !visibleActual;
    visibilidadImagenLocal[id] = nuevoValor;
    actualizarAparienciaOculta(box, nuevoValor);
    set(ref(database, "visibilidadImagen/" + id), nuevoValor)
      .catch(err => alert("❌ No se pudo cambiar la visibilidad en vivo: " + err.message));
  });
  box.appendChild(btnOjo);

  canvas.appendChild(box);

  // Cargar estado real de visibilidad guardado en Firebase (por defecto: visible)
  get(ref(database, "visibilidadImagen/" + id)).then(snap=>{
    const visible = snap.exists() ? snap.val() !== false : true;
    visibilidadImagenLocal[id] = visible;
    actualizarAparienciaOculta(box, visible);
  }).catch(()=>{ visibilidadImagenLocal[id] = true; });

  box.addEventListener("click", e=>{ e.stopPropagation(); seleccionarBox(box); });
  box.addEventListener("dblclick", e=>{ e.stopPropagation(); editarBoxImagen(box); });
  activarMoveable(box);
  return box;
}

// ── CAJA TEXTO ──
function crearBoxTexto(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  box.dataset.tipo = "texto";
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;

  // Restaurar estilos guardados
  if(datos.estilos){
    box.dataset.esFont    = datos.estilos.font    || "sans-serif";
    box.dataset.esSize    = datos.estilos.size    || 48;
    box.dataset.esBold    = datos.estilos.bold    || "false";
    box.dataset.esItalic  = datos.estilos.italic  || "false";
    box.dataset.esShadow  = datos.estilos.shadow  || "false";
    box.dataset.esColor   = datos.estilos.color   || "#ffffff";
    box.dataset.esBgcolor = datos.estilos.bgcolor || "#000000";
    box.dataset.esAlpha   = Number.isFinite(parseInt(datos.estilos.alpha)) ? parseInt(datos.estilos.alpha) : 100;
    box.dataset.esAlign   = datos.estilos.align   || "center";
    box.dataset.esValign  = datos.estilos.valign  || "center";
  }

  // Restaurar configuración de animación guardada (si existe)
  const anim = datos.animacion || {};
  box.dataset.animModo      = anim.modo || "ninguna";
  box.dataset.animVelocidad = numeroSeguro(anim.velocidad, 120);
  box.dataset.animPalabras  = JSON.stringify(Array.isArray(anim.palabras) ? anim.palabras : []);
  box.dataset.animIntervalo = numeroSeguro(anim.intervalo, 2000);

  const contenido = document.createElement("div");
  contenido.className = "texto-contenido";
  contenido.textContent = datos.contenido || "Escribe tu texto";
  box.appendChild(contenido);
  canvas.appendChild(box);

  // Aplicar estilos visuales guardados de ESTA caja (no del panel global)
  if(datos.estilos) aplicarEstilosDesdeDataset(box);

  // Aplicar animación guardada (preview en el editor)
  aplicarAnimacion(box, contenido, anim, contenido.dataset.valorActual || contenido.textContent);

  box.addEventListener("click", e=>{ e.stopPropagation(); seleccionarBox(box); });
  box.addEventListener("dblclick", e=>{ e.stopPropagation(); editarBoxTexto(box); });
  activarMoveable(box);
  return box;
}

function editarBoxTexto(box){

const modalImagenFondo = document.getElementById("modalImagenFondo");
const modalImagenArchivo = document.getElementById("modalImagenArchivo");
const modalImagenPreviewWrap = document.getElementById("modalImagenPreviewWrap");
const modalImagenPreview = document.getElementById("modalImagenPreview");
const modalImagenAjuste = document.getElementById("modalImagenAjuste");
const modalImagenTitulo = document.getElementById("modalImagenTitulo");

let imagenBase64Pendiente = null; // imagen nueva elegida en el modal (null = no se tocó)
let boxImagenEnEdicion = null;    // null = se está agregando una caja nueva

modalImagenArchivo.addEventListener("change", ()=>{
  const archivo = modalImagenArchivo.files[0];
  if(!archivo) return;
  if(!archivo.type.startsWith("image/")){
    alert("⚠ Elegí un archivo de imagen válido.");
    modalImagenArchivo.value = "";
    return;
  }
  const lector = new FileReader();
  lector.onload = ()=>{
    imagenBase64Pendiente = lector.result;
    modalImagenPreview.src = imagenBase64Pendiente;
    modalImagenPreviewWrap.style.display = "block";
  };
  lector.readAsDataURL(archivo);
});

function abrirModalImagen(box){
  boxImagenEnEdicion = box || null;
  imagenBase64Pendiente = null;
  modalImagenArchivo.value = "";
  modalImagenTitulo.textContent = box ? "Editar imagen" : "Agregar imagen";
  if(box){
    modalImagenAjuste.value = box.dataset.ajuste || "contain";
    const srcActual = box.dataset.src || "";
    if(srcActual){
      modalImagenPreview.src = srcActual;
      modalImagenPreviewWrap.style.display = "block";
    } else {
      modalImagenPreviewWrap.style.display = "none";
    }
  } else {
    modalImagenAjuste.value = "contain";
    modalImagenPreviewWrap.style.display = "none";
  }
  modalImagenFondo.style.display = "flex";
}

function editarBoxImagen(box){
  abrirModalImagen(box);
}

document.getElementById("agregarImagen").onclick = ()=>{
  abrirModalImagen(null);
};

document.getElementById("modalImagenCancelar").onclick = ()=>{
  modalImagenFondo.style.display = "none";
  boxImagenEnEdicion = null;
  imagenBase64Pendiente = null;
};

document.getElementById("modalImagenGuardar").onclick = ()=>{
  const ajuste = modalImagenAjuste.value;

  if(boxImagenEnEdicion){
    // Editando una caja de imagen ya existente
    const box = boxImagenEnEdicion;
    box.dataset.ajuste = ajuste;
    const img = box.querySelector(".imagen-contenido");
    if(imagenBase64Pendiente){
      box.dataset.src = imagenBase64Pendiente;
      if(img) img.src = imagenBase64Pendiente;
    }
    if(img) img.style.objectFit = ajuste;
  } else {
    // Agregando una caja de imagen nueva
    if(!imagenBase64Pendiente){
      alert("⚠ Elegí un archivo de imagen primero.");
      return;
    }
    const id = "imagen_" + Date.now();
    crearBoxImagen(id, {
      left: "300px", top: "800px", width: "400px", height: "400px",
      src: imagenBase64Pendiente, ajuste
    });
  }

  modalImagenFondo.style.display = "none";
  boxImagenEnEdicion = null;
  imagenBase64Pendiente = null;
};

function activarMoveable(box){
  const m = new Moveable(document.body, {
    target: box, draggable: true, resizable: true, origin: false
  })
  .on("drag", e=>{ box.style.left = e.left+"px"; box.style.top = e.top+"px"; })
  .on("resize", e=>{
    box.style.width = e.width+"px"; box.style.height = e.height+"px";
    if(box.dataset.tipo === "iframe") actualizarEscalaContenido(box);
  });
  moveables[box.id] = m;
}

function seleccionarBox(box){
  if(seleccionada) seleccionada.classList.remove("seleccionado");
  seleccionada = box;
  box.classList.add("seleccionado");

  // Si es caja de texto, mostrar panel de estilos
  if(box.dataset.tipo === "texto"){
    cajaEnEstilos = box;
    cargarPanelDesdeDataset(box);
    panelEstilos.style.display = "flex";
    // Ajustar canvas para dejar espacio al panel
    ajustarEditor();
  } else {
    panelEstilos.style.display = "none";
    cajaEnEstilos = null;
  }
}

document.getElementById("vista").addEventListener("click", ()=>{
  if(seleccionada){ seleccionada.classList.remove("seleccionado"); seleccionada = null; }
  panelEstilos.style.display = "none";
  cajaEnEstilos = null;
  ajustarEditor();
});

// BOTÓN AGREGAR IFRAME
document.getElementById("agregar").onclick = ()=>{
  const link = prompt("Pega el enlace (URL) del widget de Tikfinity:");
  if(!link) return;
  crearBoxIframe("box_"+Date.now(), { left:"100px", top:"100px", width:"400px", height:"150px", baseWidth:400, baseHeight:150, link });

// BOTÓN AGREGAR TEXTO
document.getElementById("agregarTexto").onclick = ()=>{
  const texto = prompt("Texto inicial de la caja:", "Escribe tu texto");
  if(texto === null) return;
  const id = "texto_"+Date.now();

// BOTÓN ELIMINAR
document.getElementById("eliminar").onclick = ()=>{
  if(!seleccionada){ alert("Selecciona primero una caja haciendo click sobre ella."); return; }
  const id = seleccionada.id;
  const tipo = seleccionada.dataset.tipo;
  if(moveables[id]){ moveables[id].destroy(); delete moveables[id]; }
  if(tipo === "texto") detenerAnimacion(id);
  seleccionada.remove();
  if(tipo === "imagen"){
    delete visibilidadImagenLocal[id];
    remove(ref(database, "visibilidadImagen/" + id))
      .catch(err => console.warn("No se pudo limpiar visibilidadImagen:", err));
  }
  seleccionada = null;
  panelEstilos.style.display = "none";
  cajaEnEstilos = null;
};

// BOTÓN GUARDAR — ahora incluye estilos en Firebase
document.getElementById("guardar").onclick = ()=>{
  let diseño = {};
  document.querySelectorAll(".box").forEach(box=>{
    if(box.dataset.tipo === "texto"){
      const contenido = box.querySelector(".texto-contenido");
      // Recopilar estilos guardados en dataset
      const estilos = {
        font:    box.dataset.esFont    || "sans-serif",
        size:    numeroSeguro(box.dataset.esSize, 48),
        bold:    box.dataset.esBold    === "true",
        italic:  box.dataset.esItalic  === "true",
        shadow:  box.dataset.esShadow  === "true",
        color:   box.dataset.esColor   || "#ffffff",
        bgcolor: box.dataset.esBgcolor || "#000000",
        alpha:   numeroSeguro(box.dataset.esAlpha, 100),
        align:   box.dataset.esAlign   || "center",
        valign:  box.dataset.esValign  || "center"
      };
      // Valor guardado del contenido animado (sin depender de lo que muestre el DOM en ese instante,
      // ya que en modo marquee/palabras el texto visible cambia constantemente)
      const valorContenido = contenido.dataset.valorActual || contenido.textContent;
      let palabrasGuardadas = [];
      try { palabrasGuardadas = JSON.parse(box.dataset.animPalabras || "[]"); } catch(e) { palabrasGuardadas = []; }
      const animacion = {
        modo:      box.dataset.animModo || "ninguna",
        velocidad: numeroSeguro(box.dataset.animVelocidad, 120),
        palabras:  palabrasGuardadas,
        intervalo: numeroSeguro(box.dataset.animIntervalo, 2000)
      };
      diseño[box.id] = {
        tipo: "texto",
        left: box.style.left, top: box.style.top,
        width: box.style.width, height: box.style.height,
        contenido: valorContenido,
        estilos,  // ← estilos de texto (fuente, color, etc.)
        animacion // ← nuevo campo: modo de animación (marquee / palabras / ninguna)
      };
    } else if(box.dataset.tipo === "imagen"){
      diseño[box.id] = {
        tipo: "imagen",
        left: box.style.left, top: box.style.top,
        width: box.style.width, height: box.style.height,
        src: box.dataset.src || "",
        ajuste: box.dataset.ajuste || "contain"
      };
    } else {
      const iframe = box.querySelector("iframe");
      diseño[box.id] = {
        tipo: "iframe",
        left: box.style.left, top: box.style.top,
        width: box.style.width, height: box.style.height,
        baseWidth: parseFloat(box.dataset.baseWidth),
        baseHeight: parseFloat(box.dataset.baseHeight),
        link: iframe ? iframe.src : ""
      };
    }
  });
  set(ref(database, "diseño"), diseño)
    .then(()=> alert("✅ Diseño guardado correctamente"))
    .catch(err=> alert("❌ Error al guardar: " + err.message));
};

// CARGA INICIAL
async function iniciar(){
  const snapshot = await get(ref(database, "diseño"));
  const datos = snapshot.exists() ? snapshot.val() : cajasPorDefecto;
  Object.keys(datos).forEach(id=>{
    const item = datos[id];
    if(item.tipo === "texto") crearBoxTexto(id, item);
    else if(item.tipo === "iframe") crearBoxIframe(id, item);
    else if(item.tipo === "imagen") crearBoxImagen(id, item);
  });
}
iniciar();

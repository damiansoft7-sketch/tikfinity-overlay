<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>
<style>
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:#222;
  overflow:hidden;
  font-family:sans-serif;
}
#vista{
  width:100vw; height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
#canvas{
  position:relative;
  width:1080px; height:1920px;
  transform-origin:center;
}
#guia{
  position:absolute;
  left:0; top:0;
  width:1080px; height:1920px;
  object-fit:fill;
  z-index:0;
  pointer-events:none;
}
#marco{
  position:absolute;
  left:0; top:0;
  width:100%; height:100%;
  border:8px solid white;
  box-sizing:border-box;
  pointer-events:none;
  z-index:20;
}
#zona{
  position:absolute;
  left:50px; top:150px;
  width:980px; height:1520px;
  border:5px dashed rgba(255,255,255,.5);
  pointer-events:none;
  z-index:15;
}
.box{
  position:absolute;
  overflow:hidden;
  z-index:10;
}
.box.seleccionado{
  outline:4px solid #00e5ff;
  outline-offset:2px;
}
iframe{
  position:absolute;
  left:0; top:0;
  border:none;
  background:transparent;
  pointer-events:none;
  transform-origin:top left;
}
.texto-caja{
  width:100%; height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#ffffff;
  font-weight:bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,.8);
  word-break:break-word;
  padding:4px;
  box-sizing:border-box;
}

/* PANEL DE BOTONES */
#panel{
  position:fixed;
  top:15px; left:15px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#panel button{
  padding:12px 16px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}
#guardar{ background:#2196F3; color:white; }
#agregar{ background:#4CAF50; color:white; }
#agregarTexto{ background:#FF9800; color:white; }
#eliminar{ background:#f44336; color:white; }
</style>
</head>
<body>

<div id="panel">
  <button id="guardar">GUARDAR DISEÑO</button>
  <button id="agregar">➕ AGREGAR ELEMENTO</button>
  <button id="agregarTexto">📝 AGREGAR TEXTO</button>
  <button id="eliminar">🗑 ELIMINAR SELECCIONADO</button>
</div>

<div id="vista">
  <div id="canvas">
    <img id="guia" src="guia.jpeg">
    <div id="marco"></div>
    <div id="zona"></div>
    <!-- Las cajas se generan dinámicamente desde JS -->
  </div>
</div>

<script type="module">
import { database, ref, set, get, onValue } from "./firebase.js";

const canvas = document.getElementById("canvas");

// Datos iniciales por defecto (se usan si en Firebase no hay nada guardado todavía)
// baseWidth/baseHeight = tamaño "natural" del widget, usado para calcular el zoom
const cajasPorDefecto = {
  box1: { left:"50px",  top:"200px",  width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/topliker?cid=2357749" },
  box2: { left:"630px", top:"200px",  width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749" },
  box3: { left:"50px",  top:"1500px", width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/userinfo?cid=2357749" },
  box4: { left:"630px", top:"1550px", width:"400px", height:"200px", baseWidth:400, baseHeight:200, link:"https://tikfinity.zerody.one/widget/carousel?cid=2357749" }
};

const moveables = {};   // guarda la instancia de Moveable de cada caja (por id)
let seleccionada = null; // referencia a la caja actualmente seleccionada

// Tamaño de referencia por defecto para calcular el zoom del contenido.
// OJO: esto NO debe salir del ancho/alto ya guardado (eso causaba el bug
// de que el zoom siempre quedara en 1). Es un valor fijo.
const BASE_WIDTH_DEFAULT = 400;
const BASE_HEIGHT_DEFAULT = 150;

// ESCALAR EL EDITOR AL MONITOR
function ajustarEditor(){
  let escala = Math.min(
    (window.innerWidth - 100) / 1080,
    (window.innerHeight - 100) / 1920
  );
  canvas.style.transform = `scale(${escala})`;
}
window.addEventListener("resize", ajustarEditor);
ajustarEditor();

// RECALCULA EL ZOOM DEL CONTENIDO DEL IFRAME SEGÚN EL TAMAÑO ACTUAL DE LA CAJA
function actualizarEscalaContenido(box){
  const iframe = box.querySelector("iframe");
  if(!iframe) return;
  const baseWidth = parseFloat(box.dataset.baseWidth) || 400;
  const baseHeight = parseFloat(box.dataset.baseHeight) || 150;
  const width = parseFloat(box.style.width);
  const height = parseFloat(box.style.height);

  iframe.style.width = baseWidth + "px";
  iframe.style.height = baseHeight + "px";
  iframe.style.transform = `scale(${width / baseWidth}, ${height / baseHeight})`;
}

// CREA UNA CAJA (usada tanto para las iniciales como para las nuevas)
// Soporta dos tipos: "widget" (iframe de Tikfinity, comportamiento de siempre)
// y "texto" (texto simple editable, se actualiza en vivo en el overlay)
function crearBox(id, datos){
  const box = document.createElement("div");
  box.className = "box";
  box.id = id;
  box.style.left = datos.left;
  box.style.top = datos.top;
  box.style.width = datos.width;
  box.style.height = datos.height;

  if(datos.type === "texto"){
    box.dataset.type = "texto";
    const contenido = document.createElement("div");
    contenido.className = "texto-caja";
    contenido.textContent = datos.texto || "";
    contenido.style.fontSize = (datos.fontSize || 60) + "px";
    contenido.style.color = datos.color || "#ffffff";
    box.appendChild(contenido);
    canvas.appendChild(box);
  } else {
    box.dataset.type = "widget";
    box.dataset.baseWidth = datos.baseWidth || BASE_WIDTH_DEFAULT;
    box.dataset.baseHeight = datos.baseHeight || BASE_HEIGHT_DEFAULT;

    const iframe = document.createElement("iframe");
    iframe.src = datos.link || "";
    box.appendChild(iframe);
    canvas.appendChild(box);

    actualizarEscalaContenido(box);
  }

  // Seleccionar caja al hacer click (para poder eliminarla luego)
  box.addEventListener("click", (e)=>{
    e.stopPropagation();
    seleccionarBox(box);
  });

  // Doble click: editar la caja (texto o tamaño natural/link según el tipo)
  box.addEventListener("dblclick", (e)=>{
    e.stopPropagation();
    editarBox(box);
  });

  activarMoveable(box);
  return box;
}

// PERMITE AJUSTAR EL TAMAÑO NATURAL (baseWidth/baseHeight) Y EL LINK DE UNA CAJA DE WIDGET,
// O EL TEXTO DE UNA CAJA DE TEXTO (y en ese caso lo guarda al instante en Firebase
// para que se actualice en tiempo real en el overlay, sin necesitar Guardar Diseño)
function editarBox(box){
  if(box.dataset.type === "texto"){
    const contenido = box.querySelector(".texto-caja");
    const actual = contenido.textContent;
    const nuevo = prompt("Escribe el texto a mostrar:", actual);
    if(nuevo === null) return;
    contenido.textContent = nuevo;

    // Guarda SOLO el texto de esta caja en Firebase al instante (tiempo real)
    set(ref(database, "diseño/" + box.id + "/texto"), nuevo)
      .catch(err=>{
        alert("❌ No se pudo actualizar el texto: " + err.message);
      });
    return;
  }

  const anchoActual = box.dataset.baseWidth;
  const altoActual = box.dataset.baseHeight;

  const nuevoAncho = prompt("Ancho NATURAL del widget (px). Si se ve cortado a los lados, aumenta este valor:", anchoActual);
  if(nuevoAncho === null) return;
  const nuevoAlto = prompt("Alto NATURAL del widget (px). Si se ve cortado arriba/abajo, aumenta este valor:", altoActual);
  if(nuevoAlto === null) return;

  box.dataset.baseWidth = parseFloat(nuevoAncho) || anchoActual;
  box.dataset.baseHeight = parseFloat(nuevoAlto) || altoActual;
  actualizarEscalaContenido(box);
}

// ACTIVA ARRASTRE Y REDIMENSIONADO SOBRE UNA CAJA
function activarMoveable(box){
  const m = new Moveable(document.body, {
    target: box,
    draggable: true,
    resizable: true,
    origin: false
  })
  .on("drag", e=>{
    box.style.left = e.left + "px";
    box.style.top = e.top + "px";
  })
  .on("resize", e=>{
    box.style.width = e.width + "px";
    box.style.height = e.height + "px";
    actualizarEscalaContenido(box);
  });
  moveables[box.id] = m;
}

// MARCA VISUALMENTE LA CAJA SELECCIONADA
function seleccionarBox(box){
  if(seleccionada) seleccionada.classList.remove("seleccionado");
  seleccionada = box;
  box.classList.add("seleccionado");
}

// Click fuera de cualquier caja = deselecciona
document.getElementById("vista").addEventListener("click", ()=>{
  if(seleccionada){
    seleccionada.classList.remove("seleccionado");
    seleccionada = null;
  }
});

// BOTÓN AGREGAR
document.getElementById("agregar").onclick = ()=>{
  const link = prompt("Pega el enlace (URL) del widget de Tikfinity:");
  if(!link) return;

  const id = "box_" + Date.now();

  crearBox(id, {
    left:"100px",
    top:"100px",
    width:"400px",
    height:"150px",
    baseWidth:400,
    baseHeight:150,
    link: link
  });
};

// BOTÓN AGREGAR TEXTO
document.getElementById("agregarTexto").onclick = ()=>{
  const texto = prompt("Escribe el texto a mostrar:");
  if(texto === null || texto === "") return;

  const id = "texto_" + Date.now();

  crearBox(id, {
    left:"100px",
    top:"100px",
    width:"400px",
    height:"120px",
    type:"texto",
    texto: texto,
    fontSize: 60,
    color: "#ffffff"
  });
};

// BOTÓN ELIMINAR
document.getElementById("eliminar").onclick = ()=>{
  if(!seleccionada){
    alert("Selecciona primero una caja haciendo click sobre ella.");
    return;
  }
  const id = seleccionada.id;
  if(moveables[id]){
    moveables[id].destroy();
    delete moveables[id];
  }
  seleccionada.remove();
  seleccionada = null;
};

// BOTÓN GUARDAR
document.getElementById("guardar").onclick = ()=>{
  let diseño = {};
  document.querySelectorAll(".box").forEach(box=>{
    if(box.dataset.type === "texto"){
      const contenido = box.querySelector(".texto-caja");
      diseño[box.id] = {
        left: box.style.left,
        top: box.style.top,
        width: box.style.width,
        height: box.style.height,
        type: "texto",
        texto: contenido ? contenido.textContent : "",
        fontSize: contenido ? parseFloat(contenido.style.fontSize) : 60,
        color: contenido ? contenido.style.color : "#ffffff"
      };
    } else {
      const iframe = box.querySelector("iframe");
      diseño[box.id] = {
        left: box.style.left,
        top: box.style.top,
        width: box.style.width,
        height: box.style.height,
        baseWidth: parseFloat(box.dataset.baseWidth),
        baseHeight: parseFloat(box.dataset.baseHeight),
        link: iframe ? iframe.src : ""
      };
    }
  });
  set(ref(database, "diseño"), diseño)
    .then(()=>{
      alert("✅ Diseño guardado correctamente");
    })
    .catch(err=>{
      alert("❌ Error al guardar: " + err.message);
    });
};

// CARGA INICIAL: intenta traer lo guardado en Firebase, si no existe usa las cajas por defecto
async function iniciar(){
  const snapshot = await get(ref(database, "diseño"));
  const datos = snapshot.exists() ? snapshot.val() : cajasPorDefecto;
  Object.keys(datos).forEach(id=>{
    crearBox(id, datos[id]);
  });
}
iniciar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}



/* LIENZO 9:16 */

#canvas{

position:relative;

width:56.25vh;

height:100vh;

max-width:100vw;

max-height:177.78vw;

margin:auto;

}



/* BORDE */

#marco{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

border:3px solid white;

box-sizing:border-box;

pointer-events:none;

z-index:20;

}




.box{

position:absolute;

z-index:5;

}




iframe{

width:100%;

height:100%;

border:none;

background:transparent;

pointer-events:none;

}




#guardar{

position:fixed;

top:10px;

left:10px;

padding:12px;

z-index:999;

}



</style>


</head>



<body>



<button id="guardar">

GUARDAR DISEÑO

</button>




<div id="canvas">


<div id="marco"></div>




<div class="box" id="box1"
style="left:5%;top:5%;width:40%;height:12%;">

<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749"></iframe>

</div>





<div class="box" id="box2"
style="left:55%;top:5%;width:40%;height:12%;">

<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749"></iframe>

</div>





<div class="box" id="box3"
style="left:5%;top:75%;width:40%;height:12%;">

<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749"></iframe>

</div>





<div class="box" id="box4"
style="left:55%;top:75%;width:40%;height:15%;">

<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749"></iframe>

</div>



</div>








<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,

ref,

set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";






const firebaseConfig={


apiKey:"AIzaSyDqdpAchewxlYmGrhFb5WyJKqbL5UP2XsA",

authDomain:"tikfinity-overlay.firebaseapp.com",

databaseURL:"https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId:"tikfinity-overlay",

storageBucket:"tikfinity-overlay.firebasestorage.app",

messagingSenderId:"943639302610",

appId:"1:943639302610:web:5e747094f2f6151b70380b"


};





const app=initializeApp(firebaseConfig);


const database=getDatabase(app);





const boxes=document.querySelectorAll(".box");





boxes.forEach(box=>{


const moveable=new Moveable(document.body,{

target:box,

draggable:true,

resizable:true,

scalable:true,

keepRatio:false,

origin:false


});






// MOVER

moveable.on("drag",e=>{


e.target.style.left=e.left+"px";

e.target.style.top=e.top+"px";


});







// CAMBIAR TAMAÑO

moveable.on("resize",e=>{


const target=e.target;


target.style.width=e.width+"px";

target.style.height=e.height+"px";



target.style.left=e.drag.left+"px";

target.style.top=e.drag.top+"px";


});





});









// GUARDAR FIREBASE


document.getElementById("guardar").onclick=()=>{


let diseño={};




boxes.forEach(box=>{


diseño[box.id]={


left:box.offsetLeft+"px",

top:box.offsetTop+"px",

width:box.offsetWidth+"px",

height:box.offsetHeight+"px"


};


});






set(ref(database,"diseño"),diseño)


.then(()=>{


alert("✅ Diseño guardado correctamente");


})

.catch(error=>{


alert("Error: "+error.message);


});


};





</script>



</body>

</html>

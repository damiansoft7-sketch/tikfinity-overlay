<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>


html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}



#vista{

width:100vw;
height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}




#canvas{

position:relative;

width:1080px;

height:1920px;

transform-origin:center;

}




#guia{

position:absolute;

left:0;

top:0;

width:1080px;

height:1920px;

object-fit:fill;

z-index:0;

pointer-events:none;

}





.box{

position:absolute;

overflow:hidden;

z-index:10;

border:2px dashed transparent;

}



.box.seleccionado{

border:2px dashed yellow;

}




iframe{

width:100%;

height:100%;

border:0;

background:transparent;

pointer-events:none;

}





#menu{

position:fixed;

top:10px;

left:10px;

z-index:999;

}



button{

padding:10px;

margin:3px;

}



</style>


</head>


<body>



<div id="menu">


<button id="agregar">

➕ Agregar

</button>



<button id="editar">

✏️ Editar link

</button>



<button id="eliminar">

🗑 Eliminar

</button>



<button id="guardar">

💾 Guardar

</button>



</div>







<div id="vista">


<div id="canvas">


<img id="guia" src="guia.jpeg">



</div>


</div>







<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,

ref,

set,

get

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDqdpAchewxlYmGrhFb5WyJKqbL5UP2XsA",

authDomain:"tikfinity-overlay.firebaseapp.com",

databaseURL:"https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId:"tikfinity-overlay",

storageBucket:"tikfinity-overlay.firebasestorage.app",

messagingSenderId:"943639302610",

appId:"1:943639302610:web:5e747094f2f6151b70380b"

};



initializeApp(firebaseConfig);


const db=getDatabase();




const canvas=document.getElementById("canvas");


let seleccionado=null;

let contador=0;








function ajustar(){


let escala=Math.min(

(window.innerWidth-100)/1080,

(window.innerHeight-100)/1920

);


canvas.style.transform=`scale(${escala})`;


}



window.addEventListener("resize",ajustar);


ajustar();







function seleccionar(box){


document.querySelectorAll(".box")

.forEach(e=>{

e.classList.remove("seleccionado");

});


box.classList.add("seleccionado");


seleccionado=box;


}







function crearElemento(url,id){


let box=document.createElement("div");


box.className="box";


box.id=id;



box.style.left="340px";

box.style.top="800px";

box.style.width="400px";

box.style.height="200px";



box.dataset.url=url;



box.innerHTML=`

<iframe src="${url.trim()}"></iframe>

`;



canvas.appendChild(box);



activarMovimiento(box);



}







function activarMovimiento(box){



const mover=new Moveable(document.body,{

target:box,

draggable:true,

resizable:true,

origin:false

});




mover.on("drag",e=>{


box.style.left=e.left+"px";

box.style.top=e.top+"px";


});




mover.on("resize",e=>{


box.style.width=e.width+"px";

box.style.height=e.height+"px";


});




box.onclick=()=>{


seleccionar(box);


};



}








// AGREGAR


document.getElementById("agregar").onclick=()=>{


let url=prompt(

"Pegue el link completo de TikFinity"

);



if(!url)return;



contador++;


crearElemento(

url,

"elemento_"+contador

);


};








// EDITAR LINK


document.getElementById("editar").onclick=()=>{


if(!seleccionado){

alert("Seleccione un elemento primero");

return;

}



let nuevo=prompt(

"Nuevo link TikFinity",

seleccionado.dataset.url

);



if(!nuevo)return;



seleccionado.dataset.url=nuevo;


seleccionado.querySelector("iframe").src=nuevo.trim();



};









// ELIMINAR


document.getElementById("eliminar").onclick=()=>{


if(seleccionado){


seleccionado.remove();


seleccionado=null;


}



};









// GUARDAR


document.getElementById("guardar").onclick=async()=>{


let diseño={};



document.querySelectorAll(".box")

.forEach(box=>{


diseño[box.id]={


url:box.dataset.url,

left:box.style.left,

top:box.style.top,

width:box.style.width,

height:box.style.height


};



});




await set(

ref(db,"diseño"),

diseño

);



alert("✅ Diseño guardado");


};









// CARGAR


const datos=await get(ref(db,"diseño"));



if(datos.exists()){


const diseño=datos.val();



Object.keys(diseño).forEach(id=>{


const d=diseño[id];



crearElemento(d.url,id);



let box=document.getElementById(id);



box.style.left=d.left;

box.style.top=d.top;

box.style.width=d.width;

box.style.height=d.height;



});



}



</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>
<style>
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:#222;
  overflow:hidden;
  font-family:sans-serif;
}
#vista{
  width:100vw; height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
#canvas{
  position:relative;
  width:1080px; height:1920px;
  transform-origin:center;
}
#guia{
  position:absolute;
  left:0; top:0;
  width:1080px; height:1920px;
  object-fit:fill;
  z-index:0;
  pointer-events:none;
}
#marco{
  position:absolute;
  left:0; top:0;
  width:100%; height:100%;
  border:8px solid white;
  box-sizing:border-box;
  pointer-events:none;
  z-index:20;
}
#zona{
  position:absolute;
  left:50px; top:150px;
  width:980px; height:1520px;
  border:5px dashed rgba(255,255,255,.5);
  pointer-events:none;
  z-index:15;
}
.box{
  position:absolute;
  overflow:hidden;
  z-index:10;
}
.box.seleccionado{
  outline:4px solid #00e5ff;
  outline-offset:2px;
}
iframe{
  position:absolute;
  left:0; top:0;
  border:none;
  background:transparent;
  pointer-events:none;
  transform-origin:top left;
}

/* CAJA DE TEXTO */
.texto-contenido{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-sizing:border-box;
  padding:10px;
  font-size:48px;
  font-weight:bold;
  word-break:break-word;
  line-height:1.2;
}

/* PANEL DE BOTONES */
#panel{
  position:fixed;
  top:15px; left:15px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#panel button{
  padding:12px 16px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}
#guardar{ background:#2196F3; color:white; }
#agregar{ background:#4CAF50; color:white; }
#agregarTexto{ background:#000; color:white; border:2px solid white; }
#eliminar{ background:#f44336; color:white; }
</style>
</head>
<body>

<div id="panel">
  <button id="guardar">GUARDAR DISEÑO</button>
  <button id="agregar">➕ AGREGAR ELEMENTO</button>
  <button id="agregarTexto">🔤 AGREGAR TEXTO</button>
  <button id="eliminar">🗑 ELIMINAR SELECCIONADO</button>
</div>

<div id="vista">
  <div id="canvas">
    <img id="guia" src="guia.jpeg">
    <div id="marco"></div>
    <div id="zona"></div>
    <!-- Las cajas se generan dinámicamente desde JS -->
  </div>
</div>

<script type="module">
import { database, ref, set, get } from "./firebase.js";

const canvas = document.getElementById("canvas");

// Datos iniciales por defecto (se usan si en Firebase no hay nada guardado todavía)
const cajasPorDefecto = {
  box1: { tipo:"iframe", left:"50px",  top:"200px",  width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/topliker?cid=2357749" },
  box2: { tipo:"iframe", left:"630px", top:"200px",  width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749" },
  box3: { tipo:"iframe", left:"50px",  top:"1500px", width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/userinfo?cid=2357749" },
  box4: { tipo:"iframe", left:"630px", top:"1550px", width:"400px", height:"200px", baseWidth:400, baseHeight:200, link:"https://tikfinity.zerody.one/widget/carousel?cid=2357749" }
};

const moveables = {};   // guarda la instancia de Moveable de cada caja (por id)
let seleccionada = null; // referencia a la caja actualmente seleccionada

const BASE_WIDTH_DEFAULT = 400;
const BASE_HEIGHT_DEFAULT = 150;

// ESCALAR EL EDITOR AL MONITOR
function ajustarEditor(){
  let escala = Math.min(
    (window.innerWidth - 100) / 1080,
    (window.innerHeight - 100) / 1920
  );
  canvas.style.transform = `scale(${escala})`;
}
window.addEventListener("resize", ajustarEditor);
ajustarEditor();

// RECALCULA EL ZOOM DEL CONTENIDO DEL IFRAME SEGÚN EL TAMAÑO ACTUAL DE LA CAJA
function actualizarEscalaContenido(box){
  const iframe = box.querySelector("iframe");
  if(!iframe) return;
  const baseWidth = parseFloat(box.dataset.baseWidth) || 400;
  const baseHeight = parseFloat(box.dataset.baseHeight) || 150;
  const width = parseFloat(box.style.width);
  const height = parseFloat(box.style.height);

  iframe.style.width = baseWidth + "px";
  iframe.style.height = baseHeight + "px";
  iframe.style.transform = `scale(${width / baseWidth}, ${height / baseHeight})`;
}

// CREA UNA CAJA DE IFRAME (widgets de Tikfinity, etc.)
function crearBoxIframe(id, datos){
  const box = document.createElement("div");
  box.className = "box";
  box.id = id;
  box.dataset.tipo = "iframe";
  box.style.left = datos.left;
  box.style.top = datos.top;
  box.style.width = datos.width;
  box.style.height = datos.height;
  box.dataset.baseWidth = datos.baseWidth || BASE_WIDTH_DEFAULT;
  box.dataset.baseHeight = datos.baseHeight || BASE_HEIGHT_DEFAULT;

  const iframe = document.createElement("iframe");
  iframe.src = datos.link || "";
  box.appendChild(iframe);
  canvas.appendChild(box);

  actualizarEscalaContenido(box);

  box.addEventListener("click", (e)=>{
    e.stopPropagation();
    seleccionarBox(box);
  });
  box.addEventListener("dblclick", (e)=>{
    e.stopPropagation();
    editarBoxIframe(box);
  });

  activarMoveable(box);
  return box;
}

// CREA UNA CAJA DE TEXTO (fondo negro, letra blanca)
function crearBoxTexto(id, datos){
  const box = document.createElement("div");
  box.className = "box";
  box.id = id;
  box.dataset.tipo = "texto";
  box.style.left = datos.left;
  box.style.top = datos.top;
  box.style.width = datos.width;
  box.style.height = datos.height;

  const contenido = document.createElement("div");
  contenido.className = "texto-contenido";
  contenido.textContent = datos.contenido || "Escribe tu texto";
  box.appendChild(contenido);
  canvas.appendChild(box);

  box.addEventListener("click", (e)=>{
    e.stopPropagation();
    seleccionarBox(box);
  });
  box.addEventListener("dblclick", (e)=>{
    e.stopPropagation();
    editarBoxTexto(box);
  });

  activarMoveable(box);
  return box;
}

// EDITAR ENLACE/TAMAÑO NATURAL DE UNA CAJA IFRAME
function editarBoxIframe(box){
  const anchoActual = box.dataset.baseWidth;
  const altoActual = box.dataset.baseHeight;

  const nuevoAncho = prompt("Ancho NATURAL del widget (px). Si se ve cortado a los lados, aumenta este valor:", anchoActual);
  if(nuevoAncho === null) return;
  const nuevoAlto = prompt("Alto NATURAL del widget (px). Si se ve cortado arriba/abajo, aumenta este valor:", altoActual);
  if(nuevoAlto === null) return;

  box.dataset.baseWidth = parseFloat(nuevoAncho) || anchoActual;
  box.dataset.baseHeight = parseFloat(nuevoAlto) || altoActual;
  actualizarEscalaContenido(box);
}

// EDITAR TEXTO DE UNA CAJA DE TEXTO -> se actualiza al instante en el overlay
function editarBoxTexto(box){
  const contenido = box.querySelector(".texto-contenido");
  const actual = contenido.textContent;
  const nuevo = prompt("Escribe el nuevo texto:", actual);
  if(nuevo === null) return;

  contenido.textContent = nuevo;

  // Escribe directo en Firebase para que el overlay lo reciba EN VIVO,
  // sin necesidad de presionar "GUARDAR DISEÑO"
  set(ref(database, "textoLive/" + box.id), nuevo)
    .catch(err => alert("❌ No se pudo actualizar el texto en vivo: " + err.message));
}

// ACTIVA ARRASTRE Y REDIMENSIONADO SOBRE UNA CAJA
function activarMoveable(box){
  const m = new Moveable(document.body, {
    target: box,
    draggable: true,
    resizable: true,
    origin: false
  })
  .on("drag", e=>{
    box.style.left = e.left + "px";
    box.style.top = e.top + "px";
  })
  .on("resize", e=>{
    box.style.width = e.width + "px";
    box.style.height = e.height + "px";
    if(box.dataset.tipo === "iframe"){
      actualizarEscalaContenido(box);
    }
  });
  moveables[box.id] = m;
}

// MARCA VISUALMENTE LA CAJA SELECCIONADA
function seleccionarBox(box){
  if(seleccionada) seleccionada.classList.remove("seleccionado");
  seleccionada = box;
  box.classList.add("seleccionado");
}

// Click fuera de cualquier caja = deselecciona
document.getElementById("vista").addEventListener("click", ()=>{
  if(seleccionada){
    seleccionada.classList.remove("seleccionado");
    seleccionada = null;
  }
});

// BOTÓN AGREGAR (iframe / widget Tikfinity)
document.getElementById("agregar").onclick = ()=>{
  const link = prompt("Pega el enlace (URL) del widget de Tikfinity:");
  if(!link) return;

  const id = "box_" + Date.now();

  crearBoxIframe(id, {
    left:"100px",
    top:"100px",
    width:"400px",
    height:"150px",
    baseWidth:400,
    baseHeight:150,
    link: link
  });
};

// BOTÓN AGREGAR TEXTO
document.getElementById("agregarTexto").onclick = ()=>{
  const texto = prompt("Texto inicial de la caja:", "Escribe tu texto");
  if(texto === null) return;

  const id = "texto_" + Date.now();

  crearBoxTexto(id, {
    left:"150px",
    top:"800px",
    width:"780px",
    height:"200px",
    contenido: texto
  });

  // También lo deja disponible en tiempo real desde ya
  set(ref(database, "textoLive/" + id), texto)
    .catch(err => console.error("No se pudo inicializar textoLive:", err));
};

// BOTÓN ELIMINAR
document.getElementById("eliminar").onclick = ()=>{
  if(!seleccionada){
    alert("Selecciona primero una caja haciendo click sobre ella.");
    return;
  }
  const id = seleccionada.id;
  if(moveables[id]){
    moveables[id].destroy();
    delete moveables[id];
  }
  seleccionada.remove();
  seleccionada = null;
};

// BOTÓN GUARDAR
document.getElementById("guardar").onclick = ()=>{
  let diseño = {};
  document.querySelectorAll(".box").forEach(box=>{
    if(box.dataset.tipo === "texto"){
      const contenido = box.querySelector(".texto-contenido");
      diseño[box.id] = {
        tipo: "texto",
        left: box.style.left,
        top: box.style.top,
        width: box.style.width,
        height: box.style.height,
        contenido: contenido.textContent
      };
    } else {
      const iframe = box.querySelector("iframe");
      diseño[box.id] = {
        tipo: "iframe",
        left: box.style.left,
        top: box.style.top,
        width: box.style.width,
        height: box.style.height,
        baseWidth: parseFloat(box.dataset.baseWidth),
        baseHeight: parseFloat(box.dataset.baseHeight),
        link: iframe ? iframe.src : ""
      };
    }
  });
  set(ref(database, "diseño"), diseño)
    .then(()=>{
      alert("✅ Diseño guardado correctamente");
    })
    .catch(err=>{
      alert("❌ Error al guardar: " + err.message);
    });
};

// CARGA INICIAL: intenta traer lo guardado en Firebase, si no existe usa las cajas por defecto
async function iniciar(){
  const snapshot = await get(ref(database, "diseño"));
  const datos = snapshot.exists() ? snapshot.val() : cajasPorDefecto;
  Object.keys(datos).forEach(id=>{
    const item = datos[id];
    if(item.tipo === "texto"){
      crearBoxTexto(id, item);
    } else {
      crearBoxIframe(id, item);
    }
  });
}
iniciar();
</script>
</body>
</html>

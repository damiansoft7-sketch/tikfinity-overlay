<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>


<style>


html,body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#222;

overflow:hidden;

}




/* VISTA DEL EDITOR */

#vista{

width:100vw;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}



/* LIENZO REAL 9:16 */

#canvas{


position:relative;


width:1080px;


height:1920px;


background:transparent;


transform:scale(0.35);


transform-origin:center;



}





/* BORDE REAL */

#marco{


position:absolute;


left:0;

top:0;


width:100%;

height:100%;


border:8px solid white;


box-sizing:border-box;


pointer-events:none;


z-index:100;


}







/* ZONA SEGURA */

#zona{


position:absolute;


left:50px;

top:150px;


width:980px;

height:1520px;


border:5px dashed rgba(255,255,255,0.4);


pointer-events:none;


z-index:90;


}







.box{


position:absolute;


overflow:hidden;


}






.contenido{


position:absolute;


left:0;


top:0;


width:500px;


height:300px;


transform-origin:top left;


}





iframe{


width:500px;


height:300px;


border:0;


background:transparent;


pointer-events:none;


}







#guardar{


position:fixed;


top:15px;


left:15px;


padding:12px;


z-index:999;


}



</style>


</head>



<body>



<button id="guardar">

GUARDAR DISEÑO

</button>





<div id="vista">


<div id="canvas">



<div id="marco"></div>

<div id="zona"></div>





<div class="box" id="box1"
style="left:50px;top:200px;width:400px;height:150px;">


<div class="contenido">

<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=2357749"></iframe>

</div>


</div>







<div class="box" id="box2"
style="left:630px;top:200px;width:400px;height:150px;">


<div class="contenido">

<iframe src="https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749"></iframe>

</div>


</div>







<div class="box" id="box3"
style="left:50px;top:1500px;width:400px;height:150px;">


<div class="contenido">

<iframe src="https://tikfinity.zerody.one/widget/userinfo?cid=2357749"></iframe>

</div>


</div>







<div class="box" id="box4"
style="left:630px;top:1550px;width:400px;height:200px;">


<div class="contenido">

<iframe src="https://tikfinity.zerody.one/widget/carousel?cid=2357749"></iframe>

</div>


</div>





</div>

</div>









<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,

ref,

set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";






const firebaseConfig={


apiKey:"AIzaSyDqdpAchewxlYmGrhFb5WyJKqbL5UP2XsA",

authDomain:"tikfinity-overlay.firebaseapp.com",

databaseURL:"https://tikfinity-overlay-default-rtdb.firebaseio.com",

projectId:"tikfinity-overlay",

storageBucket:"tikfinity-overlay.firebasestorage.app",

messagingSenderId:"943639302610",

appId:"1:943639302610:web:5e747094f2f6151b70380b"

};




const app=initializeApp(firebaseConfig);


const database=getDatabase(app);







const boxes=document.querySelectorAll(".box");







boxes.forEach(box=>{


const contenido=box.querySelector(".contenido");



const moveable=new Moveable(document.body,{


target:box,


draggable:true,


resizable:true,


keepRatio:false,


origin:false



});








moveable.on("drag",e=>{


box.style.left=e.left+"px";


box.style.top=e.top+"px";



});








moveable.on("resize",e=>{


box.style.width=e.width+"px";


box.style.height=e.height+"px";



let escalaX=e.width/500;


let escalaY=e.height/300;



contenido.style.transform=
`scale(${escalaX},${escalaY})`;



});



});









document.getElementById("guardar").onclick=()=>{


let diseño={};



boxes.forEach(box=>{


diseño[box.id]={


left:box.style.left,


top:box.style.top,


width:box.style.width,


height:box.style.height



};



});






set(ref(database,"diseño"),diseño)


.then(()=>{


alert("✅ Diseño guardado correctamente");


});


};





</script>



</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>
<style>
html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  background:#222;
  overflow:hidden;
  font-family:sans-serif;
}
#vista{
  width:100vw; height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
#canvas{
  position:relative;
  width:1080px; height:1920px;
  transform-origin:center;
}
#guia{
  position:absolute;
  left:0; top:0;
  width:1080px; height:1920px;
  object-fit:fill;
  z-index:0;
  pointer-events:none;
}
#marco{
  position:absolute;
  left:0; top:0;
  width:100%; height:100%;
  border:8px solid white;
  box-sizing:border-box;
  pointer-events:none;
  z-index:20;
}
#zona{
  position:absolute;
  left:50px; top:150px;
  width:980px; height:1520px;
  border:5px dashed rgba(255,255,255,.5);
  pointer-events:none;
  z-index:15;
}
.box{
  position:absolute;
  overflow:hidden;
  z-index:10;
}
.box.seleccionado{
  outline:4px solid #00e5ff;
  outline-offset:2px;
}
.box.es-contador{
  outline:3px dashed #FF9800;
  outline-offset:2px;
}
iframe{
  position:absolute;
  left:0; top:0;
  border:none;
  background:transparent;
  pointer-events:none;
  transform-origin:top left;
}
.texto-contenido{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-sizing:border-box;
  padding:10px;
  font-size:48px;
  font-weight:bold;
  word-break:break-word;
  line-height:1.2;
}
#panel{
  position:fixed;
  top:15px; left:15px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#panel button{
  padding:12px 16px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}
#guardar{ background:#2196F3; color:white; }
#agregar{ background:#4CAF50; color:white; }
#agregarTexto{ background:#000; color:white; border:2px solid white; }
#test{ background:#FF9800; color:white; }
#reset{ background:#795548; color:white; }
#eliminar{ background:#f44336; color:white; }

/* FIX (punto 8): estilos de modal compartidos por los 3 modales
   (Test, Catálogo, Editar) en vez de repetir el mismo bloque inline
   en cada uno. Solo el ancho/alto máximo varía por modal (ver abajo). */
.modal-fondo{
  display:none;
  position:fixed;
  left:0; top:0; width:100%; height:100%;
  background:rgba(0,0,0,.6);
  z-index:2000;
  align-items:center;
  justify-content:center;
}
.modal-caja{
  background:white;
  border-radius:10px;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:12px;
  font-family:sans-serif;
}
.modal-caja h3{ margin:0; }
.modal-caja select, .modal-caja input{ padding:8px; font-size:16px; }
.modal-botones{ display:flex; gap:8px; justify-content:flex-end; }
.modal-botones button{
  padding:10px 14px; border:none; border-radius:6px;
  font-weight:bold; cursor:pointer;
}
.modal-btn-confirmar{ background:#4CAF50; color:white; }
.modal-btn-cancelar{ background:#ccc; }

#modalCaja{ width:300px; }
#modalCatalogoCaja{ width:360px; max-height:82vh; overflow-y:auto; gap:10px; }
#modalEditarCaja{ width:320px; }
#modalEditarCaja label{ display:flex; align-items:center; gap:8px; font-size:15px; }

.catalogo-info{ font-size:13px; color:#666; }
.catalogo-input{ padding:8px; font-size:15px; }
.catalogo-fila-ids{ display:flex; gap:8px; }
.catalogo-fila-ids input{ flex:1; }
#listaCatalogo{
  overflow-y:auto; max-height:280px; display:flex; flex-direction:column;
  gap:6px; border-top:1px solid #eee; border-bottom:1px solid #eee; padding:8px 0;
}
#listaCatalogo em{ color:#999; }
.fila-catalogo{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:6px 4px; border-bottom:1px solid #f0f0f0; font-size:14px;
}
.fila-catalogo button{
  border:none; background:#f44336; color:white; border-radius:4px;
  padding:4px 10px; cursor:pointer; flex-shrink:0;
}
</style>
</head>
<body>

<div id="panel">
  <button id="guardar">GUARDAR DISEÑO</button>
  <button id="agregar">➕ AGREGAR ELEMENTO</button>
  <button id="agregarTexto">🔤 AGREGAR TEXTO</button>
  <button id="test">🧪 TEST</button>
  <button id="reset">♻ RESET</button>
  <button id="eliminar">🗑 ELIMINAR SELECCIONADO</button>
  <button id="catalogo" style="background:#673AB7; color:white;">📖 CATÁLOGO DE REGALOS</button>
</div>

<div id="vista">
  <div id="canvas">
    <img id="guia" src="guia.jpeg">
    <div id="marco"></div>
    <div id="zona"></div>
  </div>
</div>

<!-- MODAL TEST -->
<div id="modalFondo" class="modal-fondo">
  <div id="modalCaja" class="modal-caja">
    <h3>Simular regalo</h3>
    <label for="modalNombreRegalo">Buscar regalo en el catálogo:</label>
    <input type="text" id="modalNombreRegalo" list="listaRegalos" placeholder="Escribe para buscar (deja vacío para elegir caja abajo)">
    <label for="modalSelect">O elegir caja directamente:</label>
    <select id="modalSelect"></select>
    <label for="modalCantidad">Cantidad a sumar:</label>
    <input type="number" id="modalCantidad" value="1" min="1">
    <div class="modal-botones">
      <button id="modalCancelar" class="modal-btn-cancelar">Cancelar</button>
      <button id="modalAplicar" class="modal-btn-confirmar">Aplicar</button>
    </div>
  </div>
</div>

<!-- MODAL CATÁLOGO DE REGALOS -->
<div id="modalCatalogoFondo" class="modal-fondo">
  <div id="modalCatalogoCaja" class="modal-caja">
    <h3>📖 Catálogo de regalos</h3>
    <div class="catalogo-info">Estos son los regalos conocidos, con su ID real de TikTok. Se usan para autocompletar al editar una caja.</div>
    <div id="listaCatalogo"></div>
    <strong>Agregar nuevo</strong>
    <input type="text" id="catNombre" class="catalogo-input" placeholder="Nombre (ej: Rosa)">
    <div class="catalogo-fila-ids">
      <input type="number" id="catId" class="catalogo-input" placeholder="ID (ej: 5655)">
      <input type="number" id="catCoins" class="catalogo-input" placeholder="Monedas">
    </div>
    <div class="modal-botones">
      <button id="catCerrar" class="modal-btn-cancelar">Cerrar</button>
      <button id="catAgregar" class="modal-btn-confirmar">➕ Agregar</button>
    </div>
  </div>
</div>

<!-- MODAL EDITAR TEXTO -->
<div id="modalEditarFondo" class="modal-fondo">
  <div id="modalEditarCaja" class="modal-caja">
    <h3>Editar caja de texto</h3>
    <label for="modalEditarTexto">Texto:</label>
    <input type="text" id="modalEditarTexto">
    <label>
      <input type="checkbox" id="modalEditarContador">
      Es contador de regalo (participa en TEST y RESET)
    </label>
    <div id="modalEditarNombreRegaloWrap" style="display:flex; flex-direction:column; gap:4px;">
      <label for="modalEditarBuscarRegalo">Buscar en catálogo:</label>
      <input type="text" id="modalEditarBuscarRegalo" list="listaRegalos" placeholder="Escribe para buscar...">
      <label for="modalEditarNombreRegalo">Nombre del regalo (referencia):</label>
      <input type="text" id="modalEditarNombreRegalo" placeholder="Ej: Rosa">
      <label for="modalEditarIdRegalo">ID del regalo (esto es lo que se usa para contar):</label>
      <input type="number" id="modalEditarIdRegalo" placeholder="Ej: 5655">
    </div>
    <div class="modal-botones">
      <button id="modalEditarCancelar" class="modal-btn-cancelar">Cancelar</button>
      <button id="modalEditarGuardar" class="modal-btn-confirmar">Guardar</button>
    </div>
  </div>
</div>

<!-- Se rellena dinámicamente desde el catálogo de Firebase (ver actualizarDatalist) -->
<datalist id="listaRegalos"></datalist>

<script type="module">
import { database, ref, set, get, remove, onValue } from "./firebase.js";

const canvas = document.getElementById("canvas");

const cajasPorDefecto = {
  box1: { tipo:"iframe", left:"50px",  top:"200px",  width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/topliker?cid=2357749" },
  box2: { tipo:"iframe", left:"630px", top:"200px",  width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/socialmediarotator?cid=2357749" },
  box3: { tipo:"iframe", left:"50px",  top:"1500px", width:"400px", height:"150px", baseWidth:400, baseHeight:150, link:"https://tikfinity.zerody.one/widget/userinfo?cid=2357749" },
  box4: { tipo:"iframe", left:"630px", top:"1550px", width:"400px", height:"200px", baseWidth:400, baseHeight:200, link:"https://tikfinity.zerody.one/widget/carousel?cid=2357749" }
};

// ═══════════════════════════════════════════════════════
//  CATÁLOGO DE REGALOS (nombre + ID real de TikTok + monedas)
//  Vive en Firebase bajo "catalogoRegalos/{id}" para que quede
//  disponible entre sesiones y sirva para autocompletar al
//  editar una caja. El matching real de regalos NO depende de
//  este catálogo (eso lo hace overlay.html por ID) — esto es
//  solo una ayuda para no tener que ir a buscar cada ID a mano
//  en Tikfinity cada vez.
// ═══════════════════════════════════════════════════════
let catalogo = {}; // { "5655": {nombre:"Rosa", coins:1}, ... }

const catalogoSemilla = {
  5655:   { nombre: "Rosa",             coins: 1 },
  5487:   { nombre: "Corazón coreano",  coins: 5 },
  8913:   { nombre: "Rosa",             coins: 10 },
  6064:   { nombre: "GG",               coins: 1 },
  7569:   { nombre: "Control Retro",    coins: 100 },
  15232:  { nombre: "Eres increíble",   coins: 1 },
  105781: { nombre: "Balón giratorio", coins: 5 }
};

async function iniciarCatalogo(){
  const snap = await get(ref(database, "catalogoRegalos"));
  if(!snap.exists()){
    await set(ref(database, "catalogoRegalos"), catalogoSemilla)
      .catch(err => console.error("No se pudo sembrar el catálogo:", err));
  }
}

// FIX (punto 5): mapa texto-visible → ID de regalo, se reconstruye
// junto con el datalist. Reemplaza el parseo por regex que dependía
// de que el texto de la sugerencia mantuviera siempre el mismo
// formato exacto ("Nombre — ID 1234 (...)"); si ese formato cambia,
// ahora solo hay que tocarlo en un lugar (esta función).
let mapaTextoARegaloId = {};

function actualizarDatalist(){
  const listaRegalos = document.getElementById("listaRegalos");
  listaRegalos.innerHTML = "";
  mapaTextoARegaloId = {};
  Object.entries(catalogo)
    .sort((a,b)=> a[1].nombre.localeCompare(b[1].nombre))
    .forEach(([id, info])=>{
      const opt = document.createElement("option");
      const monedas = Number(info.coins) || 0;
      const texto = `${info.nombre} — ID ${id} (${monedas} moneda${monedas === 1 ? "" : "s"})`;
      opt.value = texto;
      mapaTextoARegaloId[texto] = id;
      listaRegalos.appendChild(opt);
    });
}

function renderizarListaCatalogo(){
  const cont = document.getElementById("listaCatalogo");
  cont.innerHTML = "";
  const entradas = Object.entries(catalogo).sort((a,b)=> a[1].nombre.localeCompare(b[1].nombre));
  if(entradas.length === 0){
    cont.innerHTML = "<em>Catálogo vacío. Agregá el primero abajo.</em>";
    return;
  }
  entradas.forEach(([id, info])=>{
    const monedas = Number(info.coins) || 0;
    const fila = document.createElement("div");
    fila.className = "fila-catalogo";
    const texto = document.createElement("span");
    texto.textContent = `🎁 ${info.nombre} — ID ${id} (${monedas} moneda${monedas === 1 ? "" : "s"})`;
    const btnDel = document.createElement("button");
    btnDel.textContent = "🗑";
    btnDel.title = "Eliminar del catálogo";
    btnDel.onclick = ()=>{
      if(confirm(`¿Eliminar "${info.nombre}" (ID ${id}) del catálogo? (Las cajas que ya lo usan no se ven afectadas)`)){
        remove(ref(database, "catalogoRegalos/" + id))
          .catch(err => alert("❌ No se pudo eliminar: " + err.message));
      }
    };
    fila.appendChild(texto);
    fila.appendChild(btnDel);
    cont.appendChild(fila);
  });
}

onValue(ref(database, "catalogoRegalos"), (snapshot)=>{
  catalogo = snapshot.exists() ? snapshot.val() : {};
  actualizarDatalist();
  renderizarListaCatalogo();
});

document.getElementById("catalogo").onclick = ()=>{
  document.getElementById("modalCatalogoFondo").style.display = "flex";
};
document.getElementById("catCerrar").onclick = ()=>{
  document.getElementById("modalCatalogoFondo").style.display = "none";
};
document.getElementById("catAgregar").onclick = ()=>{
  const nombre = document.getElementById("catNombre").value.trim();
  const id = document.getElementById("catId").value.trim();
  const coins = parseInt(document.getElementById("catCoins").value) || 0;
  if(!nombre || !id){
    alert("Completá al menos el nombre y el ID.");
    return;
  }

  // FIX (punto 4): avisar antes de sobreescribir un ID que ya existe
  const existente = catalogo[id];
  if(existente){
    const monedasExistente = Number(existente.coins) || 0;
    const confirmado = confirm(
      `⚠ El ID ${id} ya existe como "${existente.nombre}" (${monedasExistente} moneda${monedasExistente === 1 ? "" : "s"}).\n` +
      `¿Reemplazarlo por "${nombre}" (${coins} moneda${coins === 1 ? "" : "s"})?`
    );
    if(!confirmado) return;
  }

  set(ref(database, "catalogoRegalos/" + id), { nombre, coins })
    .then(()=>{
      document.getElementById("catNombre").value = "";
      document.getElementById("catId").value = "";
      document.getElementById("catCoins").value = "";
    })
    .catch(err => alert("❌ No se pudo agregar: " + err.message));
};

iniciarCatalogo();

const moveables = {};
let seleccionada = null;
const BASE_WIDTH_DEFAULT = 400;
const BASE_HEIGHT_DEFAULT = 150;

// ── ESCALAR EDITOR ──
function ajustarEditor(){
  let escala = Math.min(
    (window.innerWidth - 100) / 1080,
    (window.innerHeight - 100) / 1920
  );
  canvas.style.transform = `scale(${escala})`;
}
// FIX (punto 9): mismo freno con requestAnimationFrame que ya tiene
// ajustarCanvas() en overlay.html, para no recalcular en cada pixel
// de un resize continuo.
let resizeEditorPendiente = false;
window.addEventListener("resize", ()=>{
  if(resizeEditorPendiente) return;
  resizeEditorPendiente = true;
  requestAnimationFrame(()=>{ ajustarEditor(); resizeEditorPendiente = false; });
});
ajustarEditor();

function actualizarEscalaContenido(box){
  const iframe = box.querySelector("iframe");
  if(!iframe) return;
  const baseWidth = parseFloat(box.dataset.baseWidth) || 400;
  const baseHeight = parseFloat(box.dataset.baseHeight) || 150;
  const width = parseFloat(box.style.width);
  const height = parseFloat(box.style.height);
  iframe.style.width = baseWidth + "px";
  iframe.style.height = baseHeight + "px";
  iframe.style.transform = `scale(${width/baseWidth}, ${height/baseHeight})`;
}

// ── CAJA IFRAME ──
function crearBoxIframe(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  box.dataset.tipo = "iframe";
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;
  box.dataset.baseWidth = datos.baseWidth || BASE_WIDTH_DEFAULT;
  box.dataset.baseHeight = datos.baseHeight || BASE_HEIGHT_DEFAULT;
  const iframe = document.createElement("iframe");
  iframe.src = datos.link || "";
  box.appendChild(iframe);
  canvas.appendChild(box);
  actualizarEscalaContenido(box);
  box.addEventListener("click", e=>{ e.stopPropagation(); seleccionarBox(box); });
  box.addEventListener("dblclick", e=>{ e.stopPropagation(); editarBoxIframe(box); });
  activarMoveable(box);
  return box;
}

function editarBoxIframe(box){
  const anchoActual = box.dataset.baseWidth;
  const altoActual = box.dataset.baseHeight;
  const nuevoAncho = prompt("Ancho NATURAL del widget (px):", anchoActual);
  if(nuevoAncho === null) return;
  const nuevoAlto = prompt("Alto NATURAL del widget (px):", altoActual);
  if(nuevoAlto === null) return;
  box.dataset.baseWidth = parseFloat(nuevoAncho) || anchoActual;
  box.dataset.baseHeight = parseFloat(nuevoAlto) || altoActual;
  actualizarEscalaContenido(box);
}

// ── CAJA TEXTO / CONTADOR ──
function crearBoxTexto(id, datos){
  const box = document.createElement("div");
  box.className = "box"; box.id = id;
  box.dataset.tipo = "texto";
  box.dataset.contador = datos.contador ? "true" : "false";
  box.dataset.nombreRegalo = datos.nombreRegalo || "";
  box.dataset.regaloId = datos.regaloId || "";
  box.style.left = datos.left; box.style.top = datos.top;
  box.style.width = datos.width; box.style.height = datos.height;
  if(datos.contador) box.classList.add("es-contador");
  const contenido = document.createElement("div");
  contenido.className = "texto-contenido";
  contenido.textContent = datos.contenido || "Escribe tu texto";
  box.appendChild(contenido);
  canvas.appendChild(box);
  box.addEventListener("click", e=>{ e.stopPropagation(); seleccionarBox(box); });
  box.addEventListener("dblclick", e=>{ e.stopPropagation(); editarBoxTexto(box); });
  activarMoveable(box);
  return box;
}

let boxEnEdicion = null;

function editarBoxTexto(box){
  boxEnEdicion = box;
  const contenido = box.querySelector(".texto-contenido");
  const esContador = box.dataset.contador === "true";
  // FIX: si es contador, no mostramos el valor numérico en el campo texto
  // porque ese valor es del contador en vivo, no editable manualmente aquí
  modalEditarTexto.value = esContador ? "" : contenido.textContent;
  modalEditarTexto.disabled = esContador;
  modalEditarTexto.placeholder = esContador ? "El valor lo maneja el contador automáticamente" : "";
  modalEditarContador.checked = esContador;
  modalEditarNombreRegalo.value = box.dataset.nombreRegalo || "";
  modalEditarIdRegalo.value = box.dataset.regaloId || "";
  modalEditarBuscarRegalo.value = "";
  actualizarVisibilidadNombreRegalo();
  modalEditarFondo.style.display = "flex";
}

// FIX: sumarATexto ahora lee el valor desde Firebase para asegurarse
// de sumar desde el valor real, no desde el valor visual del editor
// que puede estar desactualizado
function sumarATexto(box, cantidad){
  const contenido = box.querySelector(".texto-contenido");
  const id = box.id;
  get(ref(database, "textoLive/" + id)).then(snapshot=>{
    const actual = snapshot.exists() ? (parseInt(snapshot.val()) || 0) : 0;
    const nuevoValor = actual + cantidad;
    contenido.textContent = String(nuevoValor);
    set(ref(database, "textoLive/" + id), String(nuevoValor))
      .catch(err => alert("❌ No se pudo actualizar el contador: " + err.message));
  }).catch(err => alert("❌ Error leyendo Firebase: " + err.message));
}

function resetearTexto(box){
  const contenido = box.querySelector(".texto-contenido");
  contenido.textContent = "0";
  set(ref(database, "textoLive/" + box.id), "0")
    .catch(err => alert("❌ No se pudo resetear: " + err.message));
}

function activarMoveable(box){
  const m = new Moveable(document.body, {
    target: box, draggable: true, resizable: true, origin: false
  })
  .on("drag", e=>{ box.style.left = e.left+"px"; box.style.top = e.top+"px"; })
  .on("resize", e=>{
    box.style.width = e.width+"px"; box.style.height = e.height+"px";
    if(box.dataset.tipo === "iframe") actualizarEscalaContenido(box);
  });
  moveables[box.id] = m;
}

function seleccionarBox(box){
  if(seleccionada) seleccionada.classList.remove("seleccionado");
  seleccionada = box;
  box.classList.add("seleccionado");
}

document.getElementById("vista").addEventListener("click", ()=>{
  if(seleccionada){ seleccionada.classList.remove("seleccionado"); seleccionada = null; }
});

// BOTÓN AGREGAR IFRAME
document.getElementById("agregar").onclick = ()=>{
  const link = prompt("Pega el enlace (URL) del widget de Tikfinity:");
  if(!link) return;
  crearBoxIframe("box_"+Date.now(), { left:"100px", top:"100px", width:"400px", height:"150px", baseWidth:400, baseHeight:150, link });
};

// BOTÓN AGREGAR TEXTO
document.getElementById("agregarTexto").onclick = ()=>{
  const texto = prompt("Texto inicial de la caja:", "Escribe tu texto");
  if(texto === null) return;
  const id = "texto_"+Date.now();
  crearBoxTexto(id, { left:"150px", top:"800px", width:"780px", height:"200px", contenido: texto });
  // FIX: siempre inicializar textoLive con el texto inicial.
  // Si luego se marca como contador, el RESET lo pondrá en "0".
  // No escribimos "0" aquí porque la caja puede ser texto normal (no contador).
  set(ref(database, "textoLive/"+id), texto).catch(err => console.error(err));
};

// BOTÓN ELIMINAR
document.getElementById("eliminar").onclick = ()=>{
  if(!seleccionada){ alert("Selecciona primero una caja haciendo click sobre ella."); return; }
  const id = seleccionada.id;
  if(moveables[id]){ moveables[id].destroy(); delete moveables[id]; }
  seleccionada.remove();
  seleccionada = null;
};

// BOTÓN GUARDAR
document.getElementById("guardar").onclick = ()=>{
  let diseño = {};
  document.querySelectorAll(".box").forEach(box=>{
    if(box.dataset.tipo === "texto"){
      const contenido = box.querySelector(".texto-contenido");
      const esContador = box.dataset.contador === "true";
      diseño[box.id] = {
        tipo: "texto",
        left: box.style.left, top: box.style.top,
        width: box.style.width, height: box.style.height,
        // FIX: si es contador, guardar "0" como contenido base —
        // el valor real vive en textoLive/{id} y el overlay siempre
        // lo lee desde ahí. Nunca guardar el valor numérico actual
        // para no pisar el contador en vivo al recargar el diseño.
        contenido: esContador ? "0" : contenido.textContent,
        contador: esContador,
        nombreRegalo: box.dataset.nombreRegalo || "",
        regaloId: box.dataset.regaloId || ""
      };
    } else {
      const iframe = box.querySelector("iframe");
      diseño[box.id] = {
        tipo: "iframe",
        left: box.style.left, top: box.style.top,
        width: box.style.width, height: box.style.height,
        baseWidth: parseFloat(box.dataset.baseWidth),
        baseHeight: parseFloat(box.dataset.baseHeight),
        link: iframe ? iframe.src : ""
      };
    }
  });
  set(ref(database, "diseño"), diseño)
    .then(()=> alert("✅ Diseño guardado correctamente"))
    .catch(err=> alert("❌ Error al guardar: " + err.message));
};

// MODAL EDITAR TEXTO
const modalEditarFondo = document.getElementById("modalEditarFondo");
const modalEditarTexto = document.getElementById("modalEditarTexto");
const modalEditarContador = document.getElementById("modalEditarContador");
const modalEditarNombreRegalo = document.getElementById("modalEditarNombreRegalo");
const modalEditarIdRegalo = document.getElementById("modalEditarIdRegalo");
const modalEditarBuscarRegalo = document.getElementById("modalEditarBuscarRegalo");
const modalEditarNombreRegaloWrap = document.getElementById("modalEditarNombreRegaloWrap");

// Al elegir una sugerencia del catálogo (formato "Nombre — ID 1234 (N monedas)"),
// autocompleta nombre + ID. Si el texto no matchea ninguna entrada del
// catálogo, no hace nada — el usuario puede seguir escribiendo nombre/ID
// a mano (por ejemplo un regalo nuevo que buscó directo en Tikfinity).
modalEditarBuscarRegalo.addEventListener("input", ()=>{
  const id = mapaTextoARegaloId[modalEditarBuscarRegalo.value];
  if(id && catalogo[id]){
    modalEditarNombreRegalo.value = catalogo[id].nombre;
    modalEditarIdRegalo.value = id;
    modalEditarBuscarRegalo.value = "";
  }
});

function actualizarVisibilidadNombreRegalo(){
  modalEditarNombreRegaloWrap.style.display = modalEditarContador.checked ? "flex" : "none";
  modalEditarTexto.disabled = modalEditarContador.checked;
  modalEditarTexto.placeholder = modalEditarContador.checked
    ? "El valor lo maneja el contador automáticamente"
    : "";
}
modalEditarContador.addEventListener("change", actualizarVisibilidadNombreRegalo);

document.getElementById("modalEditarCancelar").onclick = ()=>{
  modalEditarFondo.style.display = "none";
  boxEnEdicion = null;
};

document.getElementById("modalEditarGuardar").onclick = ()=>{
  if(!boxEnEdicion) return;
  const box = boxEnEdicion;
  const contenido = box.querySelector(".texto-contenido");
  const esContador = modalEditarContador.checked;

  box.dataset.contador = esContador ? "true" : "false";
  box.dataset.nombreRegalo = esContador ? modalEditarNombreRegalo.value.trim() : "";
  box.dataset.regaloId = esContador ? modalEditarIdRegalo.value.trim() : "";
  box.classList.toggle("es-contador", esContador);

  if(!esContador){
    // Solo actualizar texto y textoLive si NO es contador
    const nuevoTexto = modalEditarTexto.value;
    contenido.textContent = nuevoTexto;
    set(ref(database, "textoLive/" + box.id), nuevoTexto)
      .catch(err => alert("❌ No se pudo actualizar el texto en vivo: " + err.message));
  }
  // FIX: si ES contador, no tocamos textoLive ni el contenido visual —
  // el valor real del contador ya vive en Firebase y el overlay lo maneja

  modalEditarFondo.style.display = "none";
  boxEnEdicion = null;
};

// MODAL TEST
const modalFondo = document.getElementById("modalFondo");
const modalSelect = document.getElementById("modalSelect");
const modalCantidad = document.getElementById("modalCantidad");
const modalNombreRegalo = document.getElementById("modalNombreRegalo");

document.getElementById("test").onclick = ()=>{
  const cajasTexto = document.querySelectorAll('.box[data-tipo="texto"][data-contador="true"]');
  if(cajasTexto.length === 0){
    alert("No hay cajas marcadas como contador. Haz doble click en una caja y marca 'Es contador de regalo'.");
    return;
  }
  modalSelect.innerHTML = "";
  cajasTexto.forEach(box=>{
    const opt = document.createElement("option");
    opt.value = box.id;
    const nr = box.dataset.nombreRegalo;
    const rid = box.dataset.regaloId;
    opt.textContent = nr ? `🎁 ${nr} · ID ${rid || "?"} (${box.id})` : `⚠ sin nombre (${box.id})`;
    modalSelect.appendChild(opt);
  });
  modalNombreRegalo.value = "";
  modalCantidad.value = 1;
  modalFondo.style.display = "flex";
};

document.getElementById("modalCancelar").onclick = ()=>{ modalFondo.style.display = "none"; };

document.getElementById("modalAplicar").onclick = ()=>{
  const cantidad = parseInt(modalCantidad.value) || 0;
  const buscado = modalNombreRegalo.value.trim();
  let box = null;

  if(buscado){
    // FIX (punto 5): se busca el ID en el mapa texto→ID construido
    // junto al datalist, en vez de parsear el texto visible con un
    // regex — ya no depende de que el formato del texto no cambie.
    const id = mapaTextoARegaloId[buscado];
    if(!id){
      alert("⚠ Elegí una opción de la lista de sugerencias (o dejá el campo vacío y elegí la caja abajo).");
      return;
    }
    const cajasTexto = document.querySelectorAll('.box[data-tipo="texto"][data-contador="true"]');
    box = Array.from(cajasTexto).find(b => b.dataset.regaloId === id);
    if(!box){
      alert(`⚠ Ninguna caja tiene asignado el ID ${id}.`);
      return;
    }
  } else {
    box = document.getElementById(modalSelect.value);
  }

  if(box && cantidad > 0) sumarATexto(box, cantidad);
  modalFondo.style.display = "none";
};

// BOTÓN RESET
document.getElementById("reset").onclick = ()=>{
  const cajasTexto = document.querySelectorAll('.box[data-tipo="texto"][data-contador="true"]');
  if(cajasTexto.length === 0){
    alert("No hay cajas marcadas como contador.");
    return;
  }
  if(!confirm("¿Reiniciar los contadores de regalo a 0?")) return;
  cajasTexto.forEach(box => resetearTexto(box));
};

// CARGA INICIAL
async function iniciar(){
  const snapshot = await get(ref(database, "diseño"));
  const datos = snapshot.exists() ? snapshot.val() : cajasPorDefecto;
  Object.keys(datos).forEach(id=>{
    const item = datos[id];
    // FIX: ignorar tipos desconocidos (jarron u otros) para no romper el editor
    if(item.tipo === "texto") crearBoxTexto(id, item);
    else if(item.tipo === "iframe") crearBoxIframe(id, item);
  });
}
iniciar();
</script>
